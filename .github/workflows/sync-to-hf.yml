# Sincroniza cognilab/ → Hugging Face Space. Se dispara solo (push a main que
# toque cognilab/) o a mano desde la pestaña Actions.
#
# Configuración (una sola vez, desde el navegador):
# 1. Crea el Space en HF (tipo Docker, privado), p. ej. tommy/cognilab
# 2. Crea un token HF con permiso "write" en https://huggingface.co/settings/tokens
# 3. En GitHub: Settings → Secrets and variables → Actions → New repository secret
#    - HF_SYNC_TOKEN: el token de HF
#    - HF_SPACE_ID:   usuario/nombre-del-space  (p. ej. tommy/cognilab)
name: Sync CogniLab to HF Space

on:
  workflow_dispatch: # también disparable a mano
  push:
    branches: [main]
    paths: ["cognilab/**"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push cognilab/ to HF Space
        env:
          HF_SYNC_TOKEN: ${{ secrets.HF_SYNC_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_SYNC_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "Faltan secrets HF_SYNC_TOKEN / HF_SPACE_ID — omitiendo sync."
            exit 0
          fi
          cd cognilab
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Sync desde GitHub $GITHUB_SHA"
          git push --force "https://user:${HF_SYNC_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main
