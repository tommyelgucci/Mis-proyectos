name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
      - claude/alodeutsch-interactive-redesign-3x3omx
      - claude/alodeutsch-interactions-ep4lme
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://GucciTommy:$HF_TOKEN@huggingface.co/spaces/GucciTommy/ALOdeutsch HEAD:main
