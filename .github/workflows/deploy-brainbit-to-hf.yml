# Compila frontend/, arma el Space (Dockerfile + backend/ + frontend compilado)
# y lo publica como HF Docker Space en cada push a main.
#
# Configuración (una sola vez, desde el navegador):
# 1. Crea el Space: https://huggingface.co/new-space → SDK "Docker",
#    visibilidad pública o privada, p. ej. tommy/brainbit
# 2. Crea un token HF con permiso "write": https://huggingface.co/settings/tokens
# 3. En GitHub: Settings → Secrets and variables → Actions, añade:
#    - HF_SYNC_TOKEN         — el token del paso 2 (puede ser el mismo de cognilab)
#    - HF_BRAINBIT_SPACE_ID  — usuario/nombre-del-space (p. ej. tommy/brainbit)
#    - VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — igual que en frontend/.env,
#      se hornean en el bundle estático del frontend en este paso de CI
# 4. En el propio Space (Settings → Variables and secrets del Space, NO en
#    GitHub) añade, si quieres el tutor/Sprint IA:
#    - HF_API_KEY (secret)  — token de huggingface.co/settings/tokens
#    - HF_MODEL (variable, opcional)
#
# Nota: HF_API_KEY es un secret de RUNTIME del backend (Express), por eso se
# configura en el Space, no en GitHub — nunca pasa por el bundle del frontend.
name: Deploy BrainBit to HF Space (Docker)

on:
  push:
    branches: [main]
    paths: ["frontend/**", "backend/**", "deploy/hf-space/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Assemble Space
        run: |
          rm -rf space-deploy
          mkdir -p space-deploy
          cp -r backend space-deploy/backend
          rm -rf space-deploy/backend/node_modules
          cp -r frontend/dist space-deploy/public
          cp deploy/hf-space/Dockerfile space-deploy/Dockerfile
          cp deploy/hf-space/README.md space-deploy/README.md

      - name: Push to HF Space
        working-directory: space-deploy
        env:
          HF_SYNC_TOKEN: ${{ secrets.HF_SYNC_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_BRAINBIT_SPACE_ID }}
        run: |
          if [ -z "$HF_SYNC_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "Faltan secrets HF_SYNC_TOKEN / HF_BRAINBIT_SPACE_ID — omitiendo deploy."
            exit 0
          fi
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Deploy BrainBit desde GitHub $GITHUB_SHA"
          git push --force "https://user:${HF_SYNC_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main
