# Compila frontend/ y publica el resultado (dist/) como Space estático de
# Hugging Face en cada push a main.
#
# Configuración (una sola vez, desde el navegador):
# 1. Crea el Space en HF: https://huggingface.co/new-space → SDK "Static",
#    visibilidad pública, p. ej. tommy/brainbit
# 2. Crea un token HF con permiso "write": https://huggingface.co/settings/tokens
# 3. En GitHub: Settings → Secrets and variables → Actions:
#    - Secret HF_SYNC_TOKEN_OLA:  tu token de HF con permiso write (nombre
#      distinto del de cognilab a propósito, para no mezclarlo con tokens "read")
#    - Secret HF_BRAINBIT_SPACE_ID: usuario/nombre-del-space (p. ej. tommy/brainbit)
#    - Secret VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, (opcional) VITE_HF_API_KEY,
#      VITE_HF_MODEL: mismos valores que en frontend/.env — se compilan dentro
#      del bundle estático, así que la app funciona sin backend propio.
#
# Nota: un Space "Static" solo sirve archivos; no hay servidor ni variables de
# entorno en runtime, por eso las claves se inyectan en tiempo de build.
name: Deploy BrainBit to HF Space

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_HF_API_KEY: ${{ secrets.VITE_HF_API_KEY }}
          VITE_HF_MODEL: ${{ secrets.VITE_HF_MODEL }}
        run: npm run build

      - name: Prepare Space README
        working-directory: frontend/dist
        run: |
          cat > README.md <<'EOF'
          ---
          title: BrainBit
          emoji: 🧠
          colorFrom: red
          colorTo: gray
          sdk: static
          pinned: false
          ---
          EOF

      - name: Push dist/ to HF Space
        working-directory: frontend/dist
        env:
          HF_SYNC_TOKEN: ${{ secrets.HF_SYNC_TOKEN_OLA }}
          HF_SPACE_ID: ${{ secrets.HF_BRAINBIT_SPACE_ID }}
        run: |
          if [ -z "$HF_SYNC_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
            echo "Faltan secrets HF_SYNC_TOKEN_OLA / HF_BRAINBIT_SPACE_ID — omitiendo deploy."
            exit 0
          fi
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Deploy BrainBit desde GitHub $GITHUB_SHA"
          git push --force "https://user:${HF_SYNC_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" main
