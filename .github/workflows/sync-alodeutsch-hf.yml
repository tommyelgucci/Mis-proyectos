# Sincroniza alodeutsch/ → Hugging Face Space solo cuando se lanza manualmente.
# El push automático a main está desactivado para permitir publicación manual.
#
# Secret necesario (Settings → Secrets and variables → Actions):
#   - HF_TOKEN: token de Hugging Face con permiso "write"
name: Sync Alodeutsch to HF Space

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push alodeutsch/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "ERROR: falta el secret HF_TOKEN; no se ha publicado ALOdeutsch."
            exit 1
          fi
          cd alodeutsch
          # El bundle offline (>10 MiB) no lo usa el Space y HF rechaza archivos de ese tamaño.
          rm -f alodeutsch-offline.html
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Sync manual desde GitHub $GITHUB_SHA"
          git push --force "https://GucciTommy:${HF_TOKEN}@huggingface.co/spaces/GucciTommy/ALOdeutsch" main
