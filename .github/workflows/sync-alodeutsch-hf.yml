# Sincroniza alodeutsch/ → Hugging Face Space en cada push a main.
#
# Mismo patrón que sync-to-hf.yml (CogniLab): la app vive en una subcarpeta del
# monorepo, pero el Space la recibe en su raíz — por eso el `cd alodeutsch` antes
# de inicializar el repo que se empuja. Así el Dockerfile y el README con el
# frontmatter de HF quedan donde el Space los busca sin ocupar la raíz del repo,
# que es de BrainBit (SnapDeploy exige el Dockerfile ahí).
#
# Secret necesario (Settings → Secrets and variables → Actions):
#   - HF_TOKEN: token de Hugging Face con permiso "write"
name: Sync Alodeutsch to HF Space

on:
  push:
    branches: [main]
    paths: ["alodeutsch/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push alodeutsch/ to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Falta el secret HF_TOKEN — omitiendo sync."
            exit 0
          fi
          cd alodeutsch
          git init -b main
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Sync desde GitHub $GITHUB_SHA"
          git push --force "https://GucciTommy:${HF_TOKEN}@huggingface.co/spaces/GucciTommy/ALOdeutsch" main
