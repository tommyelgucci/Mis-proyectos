name: Build Alodeutsch single HTML

on:
  push:
    branches:
      - feat/alodeutsch-single-html
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Build standalone HTML
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("alodeutsch")
          base = (root / "alodeutsch.html").read_text(encoding="utf-8")
          index = (root / "index.html").read_text(encoding="utf-8")

          # Reproduce the current index.html patching logic, but without
          # runtime fetches so the result is a single local HTML file.
          replacements = [
            (
              'if(l.id===11) h+=L11AudioPractice.render()+L11Tenses.render();',
              'if(l.id===11) h+=L11AudioPractice.render()+L11Tenses.render(); h+=`<div class="intro-box" style="margin-top:20px"><h3>⚡ Repaso de C y D</h3><p>12 preguntas sobre expresiones, tráfico e In der Fremde.</p>${L11FastReview.render()}</div>`;'
            ),
            (
              '    </div>\n    <div class="exam-score-pill"',
              '      <p><a href="#" onclick="event.preventDefault(); App.toast(\'El entrenador telc B1 es un archivo separado del repositorio y no forma parte del HTML único.\')">🎯 Entrenador telc B1 actualizado</a></p>\n    </div>\n    <div class="exam-score-pill"'
            ),
            (
              '<div id="scr-b1-official-exam" class="scr">',
              '<div id="scr-b2-lessons" class="scr"><div id="b2-lessons-body" style="padding-bottom:30px"></div></div>\n<div id="scr-b2-lesson" class="scr"><div id="b2-lesson-body" class="study-body" style="padding-top:14px;padding-bottom:30px"></div></div>\n<div id="scr-b22-lessons" class="scr"><div id="b22-lessons-body" class="study-body" style="padding-bottom:30px"></div></div>\n<div id="scr-b22-lesson" class="scr"><div id="b22-lesson-body" class="study-body" style="padding-top:14px;padding-bottom:30px"></div></div>\n<div id="scr-c11-lessons" class="scr"><div id="c11-lessons-body" class="study-body" style="padding-bottom:30px"></div></div>\n<div id="scr-c11-lesson" class="scr"><div id="c11-lesson-body" class="study-body" style="padding-top:14px;padding-bottom:30px"></div></div>\n<div id="scr-b1-official-exam" class="scr">'
            ),
            (
              "    'b1-lesson':'',",
              "    'b1-lesson':'',\n    'b2-lessons':'📚 Sicher! B2.1 · Lektionen 1–6',\n    'b2-lesson':'',\n    'b22-lessons':'📚 Sicher! B2.2 · Lektionen 7–12',\n    'b22-lesson':'',\n    'c11-lessons':'📘 Sicher! C1 · Lektionen 1–12',\n    'c11-lesson':'',"
            ),
            (
              '    h+=`<div class="grid-label">${lv.MODS.length} ${Lang.td(\'lvl.mods\',\'Módulos de Gramática\')}</div><div class="mod-grid">`;',
              '    if(Current.levelId===\'b2\') h+=`<div class="center-cta" style="margin:12px 16px 18px;padding:24px 18px"><h2>Sicher! B2.1 · Lektionen 1–6</h2><button class="pill-btn" onclick="B2Lessons.open()">${Lang.current===\'en\'?\'Open lessons →\':\'Abrir lecciones →\'}</button></div>`;\n    if(Current.levelId===\'b2\') h+=B22Lessons.banner();\n    if(Current.levelId===\'b2c1\') h+=C11Lessons.banner();\n    h+=`<div class="grid-label">${lv.MODS.length} ${Lang.td(\'lvl.mods\',\'Módulos de Gramática\')}</div><div class="mod-grid">`;'
            )
          ]

          # Only apply a patch when its source exists, matching the safety
          # behavior of index.html.
          for old, new in replacements:
              if old in base:
                  base = base.replace(old, new, 1)

          # Kontext B2/C1 course banners (level screens).
          level_slot = "    h+=`<div class=\"grid-label\">${lv.MODS.length} ${Lang.td('lvl.mods','Módulos de Gramática')}</div><div class=\"mod-grid\">`;"
          kontext_banners = "    if(['b1','b2','c1','b2c1'].includes(Current.levelId)&&window.TelcCoach) h+=TelcCoach.banner(Current.levelId);\n    if(Current.levelId==='b2') h+=`<div class=\"center-cta\" style=\"margin:12px 16px 18px;padding:24px 18px;background:linear-gradient(135deg,var(--lav),var(--sky));border:1.5px solid var(--border);border-radius:var(--r-xl)\"><div style=\"font-size:42px\">🧭</div><h2 style=\"font-family:'Baloo 2';font-size:21px;color:var(--ink)\">Kontext B2 Intensiv · telc B2</h2><p style=\"font-size:13px;color:var(--ink-soft)\">${Lang.current==='en'?'Long lessons with tables, tips and vocabulary by topic, 44 practice missions, flashcards, Schreiben/Sprechen workshop, mock tests and appendix.':'Lecciones largas con tablas, trucos y vocabulario por campos, 44 misiones de práctica, tarjetas, taller de Schreiben/Sprechen, simulacros y Anhang (Nomen-Verb-Verbindungen, Funktionsverbgefüge).'}</p><button class=\"pill-btn\" onclick=\"(window.openKontext||function(i){window.open('./kontext-'+i+'.html','_blank')})('b2')\">${Lang.current==='en'?'Open course →':'Abrir curso →'}</button></div>`;\n    if(Current.levelId==='c1') h+=`<div class=\"center-cta\" style=\"margin:12px 16px 18px;padding:24px 18px;background:linear-gradient(135deg,var(--lav),var(--sky));border:1.5px solid var(--border);border-radius:var(--r-xl)\"><div style=\"font-size:42px\">🧭</div><h2 style=\"font-family:'Baloo 2';font-size:21px;color:var(--ink)\">Kontext C1 Intensiv · telc C1</h2><p style=\"font-size:13px;color:var(--ink-soft)\">${Lang.current==='en'?'Chapter lessons with tables, tips and vocabulary by topic, gap-fill and matching exercises, flashcards, Hören with transcripts, argumentative writing, rubrics and mock tests.':'Lecciones por capítulo con tablas, trucos y vocabulario por campos, ejercicios de huecos y emparejar, tarjetas, Hören con guion, texto argumentativo, rúbricas y simulacros.'}</p><button class=\"pill-btn\" onclick=\"(window.openKontext||function(i){window.open('./kontext-'+i+'.html','_blank')})('c1')\">${Lang.current==='en'?'Open course →':'Abrir curso →'}</button></div>`;\n"
          if level_slot in base:
              base = base.replace(level_slot, kontext_banners + level_slot, 1)

          # The current wrapper loads this module first, then the remaining
          # updates. Embed all of them directly into the document.
          modules = [
            "l11-quick-review.js",
            "b1-class-practice.js",
            "b1-class-writing-practice.js",
            "b2-sicher-lessons.js",
            "b22-sicher-lessons.js",
            "b2-lesson-practice.js",
            "b2-guided-study.js",
            "c11-sicher-lessons.js",
            "c12-sicher-lessons.js",
            "b1-kahoot-mixed-review.js",
            "b1-uebungstests-4-5.js",
            "game-expansion.js",
            "placement-expansion.js",
            "lesson-narration.js",
            "lernreise.js",
            "lernreise.js",
            "alo-theme.js",
            "telc-coach-data.js",
            "kontext-extra.js",
            "telc-coach.js",
          ]

          marker = "</body>"
          embedded = []
          for name in modules:
              p = root / name
              if not p.exists():
                  continue
              code = p.read_text(encoding="utf-8")
              embedded.append(f"<!-- Alodeutsch module: {name} -->\n<script>\n{code}\n</script>")

          # Remove remote font dependencies so the file remains usable offline.
          import re
          base = re.sub(r'\s*<link[^>]+(?:fonts\.googleapis\.com|fonts\.gstatic\.com)[^>]*>', '', base, flags=re.I)

          bundle = base.replace(marker, "\n".join(embedded) + "\n" + marker, 1)

          # Embed the telc trainer as a Blob-backed HTML document so no second file is needed.
          trainer = (root / "ALOdeutsch_TELC_B1_Trainer.html").read_text(encoding="utf-8")
          import json
          trainer_json = json.dumps(trainer.replace("</script", "<\\/script"), ensure_ascii=False)
          trainer_script = "<script>\nconst ALO_TELC_TRAINER=" + trainer_json + ";\nwindow.openTelcTrainer=function(){const u=URL.createObjectURL(new Blob([ALO_TELC_TRAINER],{type:'text/html;charset=utf-8'}));window.open(u,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(u),60000);};\n</script>"
          # Kontext B2/C1 courses as Blob-backed documents (single-file offline build).
          kontext = {}
          for kid in ("b2", "c1"):
              kontext[kid] = (root / f"kontext-{kid}.html").read_text(encoding="utf-8")
          kontext_script = "<script>\nconst ALO_KONTEXT=" + json.dumps(kontext, ensure_ascii=False).replace("<", "\\u003c") + ";\nwindow.openKontext=function(id){const u=URL.createObjectURL(new Blob([ALO_KONTEXT[id]],{type:'text/html;charset=utf-8'}));const w=window.open(u,'_blank');if(!w)location.href=u;};\n</script>"
          bundle = bundle.replace(marker, trainer_script + "\n" + kontext_script + "\n" + marker, 1)
          bundle = bundle.replace("<title>🌟 Alodeutsch · Lernen mit Ola</title>",
                                  "<title>🌟 Alodeutsch · Offline · Lernen mit Ola</title>")
          bundle = bundle.replace("onclick=\"event.preventDefault(); App.toast('El entrenador telc B1 es un archivo separado del repositorio y no forma parte del HTML único.')\"",
                                  "onclick=\"event.preventDefault(); openTelcTrainer()\"")
          (root / "alodeutsch-offline.html").write_text(bundle, encoding="utf-8")
          print(f"Built {root/'alodeutsch-offline.html'}: {len(bundle):,} bytes")
          PY
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: alodeutsch-offline-html
          path: alodeutsch/alodeutsch-offline.html
          if-no-files-found: error

      - name: Commit bundled HTML
        # Commit generated offline bundle on push events, including main after merge.
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alodeutsch/alodeutsch-offline.html
          git diff --cached --quiet && exit 0
          git commit -m "build: bundle Alodeutsch into one offline HTML"
          git push
