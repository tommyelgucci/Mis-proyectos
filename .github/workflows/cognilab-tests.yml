name: CogniLab frontend checks

on:
  pull_request:
    paths:
      - "cognilab/frontend/**"
      - ".github/workflows/cognilab-tests.yml"
  push:
    branches: [main]
    paths:
      - "cognilab/frontend/**"
      - ".github/workflows/cognilab-tests.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognilab/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cognilab/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
