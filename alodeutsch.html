<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌟 Alodeutsch · Lernen mit Ola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   RESET
   ══════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,textarea{font-family:inherit}
::selection{background:var(--ola);color:#fff}

/* ══════════════════════════════════════════════════════════
   TOKENS — Paleta "Alodeutsch" (pastel + acento dorado de Ola)
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#F4F9F4;
  --bg-alt:#EAF4F0;
  --card:#FFFFFF;
  --ink:#264035;
  --ink-soft:#5C7568;
  --ink-faint:#9AAFA3;
  --border:#DCEAE1;

  --sage:#BFE3CC;          --sage-ink:#1F5E3C;
  --sky:#BFDCF5;           --sky-ink:#1A5487;
  --blush:#FBD3D9;         --blush-ink:#9C3A48;
  --butter:#FCE6A6;        --butter-ink:#8A6412;
  --lav:#DCD3F2;           --lav-ink:#4C3B85;

  --ola:#DE9B1F;           /* acento dorado — color de Ola */
  --ola-d:#B87E12;
  --ola-light:#FFD873;

  --ok:#2E9E63;    --ok-l:#E3F6EA;
  --bad:#D6485B;   --bad-l:#FCEBED;

  --r-xl:26px;--r-l:20px;--r-m:14px;--r-s:10px;
  --shadow-sm:0 1px 3px rgba(38,64,53,.06),0 2px 8px rgba(38,64,53,.05);
  --shadow-md:0 4px 14px rgba(38,64,53,.09),0 1px 4px rgba(38,64,53,.06);
  --shadow-lg:0 10px 30px rgba(38,64,53,.14);
}

h1,h2,h3,.display{font-family:'Baloo 2',system-ui,sans-serif}

/* ══════════════════════════════════════════════════════════
   SCREENS
   ══════════════════════════════════════════════════════════ */
.scr{display:none;min-height:100vh}
.scr.on{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.scr.on{animation:none}}

/* ══════════════════════════════════════════════════════════
   OLA — avatar-estrella animado
   ══════════════════════════════════════════════════════════ */
.ola-avatar{
  display:inline-flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 0 6px rgba(222,155,31,.45));
  animation:olaBreathe 3.2s ease-in-out infinite;
  transform-origin:center;
  will-change:transform,filter;
}
@keyframes olaBreathe{
  0%,100%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.08) rotate(-2deg)}
}
.ola-avatar.blink{animation:olaBlink .35s ease}
@keyframes olaBlink{
  0%{transform:scale(1) scaleY(1)}
  45%{transform:scale(1.03) scaleY(.25)}
  100%{transform:scale(1) scaleY(1)}
}
.ola-avatar.speaking{
  animation:olaSpeak .55s ease-in-out infinite;
  filter:drop-shadow(0 0 14px rgba(222,155,31,.85));
}
@keyframes olaSpeak{
  0%,100%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.16) rotate(3deg)}
}
.ola-avatar.celebrate{animation:olaCelebrate .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes olaCelebrate{
  0%{transform:scale(.6) rotate(0deg)}
  60%{transform:scale(1.3) rotate(20deg)}
  100%{transform:scale(1) rotate(0deg)}
}
@media (prefers-reduced-motion:reduce){.ola-avatar{animation:none!important}}

/* ══════════════════════════════════════════════════════════
   BANNER PERMANENTE
   ══════════════════════════════════════════════════════════ */
.app-banner{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:10px;
  background:rgba(244,249,244,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  padding:10px 14px;
}
.app-banner-back{
  background:none;border:none;color:var(--ola-d);font-weight:700;font-size:14px;
  cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:3px;flex-shrink:0;
}
.app-banner-mid{flex:1;min-width:0;text-align:center}
.app-banner-title{font-family:'Baloo 2';font-weight:700;font-size:14.5px;color:var(--ink);letter-spacing:.2px}
.app-banner-title b{color:var(--ola-d)}
.app-banner-sub{font-size:10.5px;color:var(--ink-faint);margin-top:0px}
.app-banner-ola{font-size:19px;flex-shrink:0}

/* ══════════════════════════════════════════════════════════
   WELCOME / HERO
   ══════════════════════════════════════════════════════════ */
.hero{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 15% 12%, var(--sky) 0%, transparent 45%),
    radial-gradient(circle at 85% 18%, var(--blush) 0%, transparent 42%),
    radial-gradient(circle at 50% 92%, var(--sage) 0%, transparent 50%),
    var(--bg);
}
.hero-stamp{
  width:120px;height:120px;border-radius:50%;
  border:3px dashed var(--ola);
  display:flex;align-items:center;justify-content:center;
  font-size:58px;margin-bottom:22px;background:#fff;box-shadow:var(--shadow-md);
}
.hero-title{font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.4px;line-height:1.25}
.hero-title b{color:var(--ola-d)}
.hero-sub{color:var(--ink-soft);font-size:14px;margin-top:8px;max-width:300px}
.hero-actions{width:100%;max-width:360px;margin-top:34px;display:flex;flex-direction:column;gap:12px}

.btn-hero{
  border:none;border-radius:var(--r-l);padding:19px 20px;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:14px;font-family:inherit;
  transition:transform .12s,box-shadow .12s;box-shadow:var(--shadow-sm);
}
.btn-hero:active{transform:scale(.97)}
.btn-hero.primary{background:linear-gradient(135deg,var(--ola),#F0B84A);box-shadow:0 8px 22px rgba(222,155,31,.35)}
.btn-hero.secondary{background:#fff;border:1.5px solid var(--border)}
.btn-hero-emoji{font-size:26px;flex-shrink:0}
.btn-hero-title{font-weight:800;font-size:15px}
.btn-hero.primary .btn-hero-title{color:#fff}
.btn-hero.secondary .btn-hero-title{color:var(--ink)}
.btn-hero-desc{font-size:11.5px;margin-top:2px}
.btn-hero.primary .btn-hero-desc{color:rgba(255,255,255,.9)}
.btn-hero.secondary .btn-hero-desc{color:var(--ink-faint)}

/* ══════════════════════════════════════════════════════════
   DASHBOARD DE RUTAS (camino de niveles)
   ══════════════════════════════════════════════════════════ */
.route-wrap{padding:18px 16px 60px;max-width:480px;margin:0 auto}
.route-head{text-align:center;margin-bottom:22px}
.route-head-title{font-size:19px;font-weight:800;color:var(--ink)}
.route-head-sub{font-size:12px;color:var(--ink-faint);margin-top:2px}

.route-path{position:relative;padding-left:6px}
.route-path::before{
  content:'';position:absolute;left:31px;top:14px;bottom:14px;width:3px;
  background:repeating-linear-gradient(to bottom,var(--border) 0 8px,transparent 8px 14px);
}
.route-node{position:relative;display:flex;gap:14px;padding:10px 0 26px;cursor:pointer}
.route-node.locked{cursor:default}
.route-node-dot{
  width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:var(--card);border:3px solid var(--sage);box-shadow:var(--shadow-sm);z-index:1;
  transition:transform .12s;
}
.route-node:active .route-node-dot{transform:scale(.94)}
.route-node.locked .route-node-dot{border-color:var(--border);background:#F1F5F2;filter:grayscale(.5);opacity:.75}
.route-node-body{flex:1;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-m);padding:13px 14px;box-shadow:var(--shadow-sm)}
.route-node.locked .route-node-body{opacity:.6}
.route-node-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.route-node-title{font-weight:800;font-size:15px;color:var(--ink)}
.route-node-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:20px}
.route-node-tag.active{background:var(--ok-l);color:var(--ok)}
.route-node-tag.locked{background:var(--border);color:var(--ink-faint)}
.route-node-desc{font-size:12px;color:var(--ink-soft);margin-top:4px}
.route-node-prog-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.route-node-prog-bar{flex:1;height:5px;background:var(--border);border-radius:10px;overflow:hidden}
.route-node-prog-fill{height:100%;background:linear-gradient(90deg,var(--sage-ink),var(--ok));border-radius:10px}
.route-node-prog-pct{font-size:11px;font-weight:700;color:var(--ok);min-width:30px;text-align:right}
.lock-icon{font-size:13px;margin-left:4px;opacity:.7}

.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:50px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-lg);z-index:200;opacity:0;pointer-events:none;transition:all .28s ease;
  display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:88vw;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════
   MODULE GRID
   ══════════════════════════════════════════════════════════ */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-m);padding:13px 12px;cursor:pointer;transition:transform .1s}
.mod-card:active{transform:scale(.96)}
.mod-card-top{display:flex;align-items:center;justify-content:space-between}
.mod-emoji{font-size:21px}
.mod-score{background:var(--sky);color:var(--sky-ink);font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.mod-title{font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.3;color:var(--ink)}
.mod-sub{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
.mod-dot{width:5px;height:5px;border-radius:50%;background:var(--border);margin-top:8px}
.mod-dot.done{background:var(--ok)}
.error-card{background:linear-gradient(135deg,var(--ola),#F0B84A);border-radius:var(--r-l);padding:16px;margin-bottom:14px;cursor:pointer}
.error-card:active{transform:scale(.98)}
.error-card-emoji{font-size:23px;margin-bottom:5px}
.error-card-title{color:#fff;font-size:16px;font-weight:800}
.error-card-sub{color:rgba(255,255,255,.85);font-size:12px;margin-top:2px}
.grid-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
.grid-label:first-child{margin-top:0}

/* ══════════════════════════════════════════════════════════
   TABS
   ══════════════════════════════════════════════════════════ */
.tab-bar{display:flex;gap:6px;padding:0 12px 12px;position:sticky;top:53px;z-index:40;background:rgba(244,249,244,.95);backdrop-filter:blur(6px);padding-top:10px}
.tab-btn{flex:1;padding:9px 2px;border-radius:var(--r-s);border:none;font-size:10.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab-btn.active{background:var(--ola);color:#fff}
.tab-btn.inactive{background:var(--bg-alt);color:var(--ink-soft)}

/* ══════════════════════════════════════════════════════════
   ESTUDIO
   ══════════════════════════════════════════════════════════ */
.study-body{padding:6px 16px 40px}
.sec-title{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;margin:18px 0 8px}
.sec-title:first-child{margin-top:0}
.rule-box{background:var(--sky);border-left:4px solid var(--sky-ink);padding:11px 13px;border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:8px;font-size:13.5px;color:var(--sky-ink);line-height:1.6}
.warn-box{background:var(--butter);border-left:4px solid var(--butter-ink);padding:11px 13px;border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:8px;font-size:13px;color:var(--butter-ink);line-height:1.6}
.ex-box{background:var(--sage);border-left:4px solid var(--sage-ink);padding:10px 13px;border-radius:0 var(--r-s) var(--r-s) 0;margin-bottom:7px;font-size:13px;color:var(--sage-ink);font-style:italic;line-height:1.5}
.intro-box{background:var(--lav);border:1.5px solid var(--lav-ink);border-radius:var(--r-m);padding:13px;margin-bottom:14px;font-size:14px;color:var(--lav-ink);line-height:1.6}

.tbl-wrap{overflow-x:auto;border-radius:var(--r-m);border:1px solid var(--border);margin-bottom:12px;-webkit-overflow-scrolling:touch;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg-alt);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-weight:700;color:var(--ink);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #F0F5F1;color:var(--ink-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#FBFDFB}

/* ══════════════════════════════════════════════════════════
   QUIZ
   ══════════════════════════════════════════════════════════ */
.quiz-body{padding:6px 16px 40px}
.quiz-prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.quiz-counter{font-size:12px;color:var(--ink-faint);font-weight:600}
.quiz-live-score{font-size:12px;font-weight:700;color:var(--ok)}
.quiz-bar{height:4px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.quiz-bar-fill{height:100%;background:linear-gradient(90deg,var(--sky-ink),var(--ola));transition:width .3s}

.q-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-l);padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.q-type-label{font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.q-text{font-size:15px;font-weight:600;color:var(--ink);line-height:1.5}

.opt-btn{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-m);border:2px solid var(--border);background:#fff;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px;color:var(--ink);line-height:1.4;transition:border-color .1s,background .1s}
.opt-btn:active{transform:scale(.98)}
.opt-btn.correct{border-color:var(--ok);background:var(--ok-l);color:#1a6b35;font-weight:700}
.opt-btn.wrong{border-color:var(--bad);background:var(--bad-l);color:#a00}

.fill-input{width:100%;border:2px solid var(--border);border-radius:var(--r-m);padding:13px 15px;font-size:16px;color:var(--ink);background:#fff;outline:none;margin-bottom:10px}
.fill-input:focus{border-color:var(--sky-ink)}
.fill-input.ok{border-color:var(--ok);background:var(--ok-l)}
.fill-input.bad{border-color:var(--bad);background:var(--bad-l)}
.verify-btn{width:100%;padding:14px;border-radius:var(--r-m);border:none;background:var(--ola);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.verify-btn:active{opacity:.88}

.fb-box{border-radius:var(--r-m);padding:14px 15px;margin-bottom:12px}
.fb-box.ok{background:var(--ok-l);border:1.5px solid var(--ok)}
.fb-box.bad{background:var(--bad-l);border:1.5px solid var(--bad)}
.fb-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fb-emoji{font-size:18px}
.fb-label{font-size:15px;font-weight:700}
.fb-label.ok{color:#1a6b35}
.fb-label.bad{color:#a00}
.fb-exp{font-size:13px;line-height:1.6;color:#3a3a3a}

.next-btn{width:100%;padding:14px;border-radius:var(--r-m);border:2px solid var(--border);background:#fff;color:var(--ink);font-size:15px;font-weight:700;cursor:pointer}
.next-btn:active{background:var(--bg-alt)}

.results{text-align:center;padding:32px 16px}
.results-emoji{font-size:56px;margin-bottom:12px}
.results-score{font-size:40px;font-weight:900;color:var(--ink)}
.results-pct{font-size:20px;font-weight:700;margin-bottom:8px}
.results-msg{color:var(--ink-soft);font-size:15px;margin-bottom:28px}
.results-btn-p{width:100%;padding:15px;border-radius:var(--r-m);border:none;background:var(--ola);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.results-btn-s{width:100%;padding:15px;border-radius:var(--r-m);border:2px solid var(--border);background:#fff;color:var(--ink);font-size:16px;font-weight:700;cursor:pointer}

/* ══════════════════════════════════════════════════════════
   FLASHCARDS
   ══════════════════════════════════════════════════════════ */
.deck-grid{padding:14px 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin:0 auto}
.deck-card{border-radius:var(--r-l);padding:16px 14px;color:#fff;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .1s}
.deck-card:active{transform:scale(.96)}
.deck-emoji{font-size:24px}
.deck-title{font-weight:800;font-size:14px;margin-top:8px}
.deck-sub{font-size:10.5px;opacity:.85;margin-top:2px}
.deck-prog{margin-top:10px;height:4px;background:rgba(255,255,255,.35);border-radius:10px;overflow:hidden}
.deck-prog-fill{height:100%;background:#fff;border-radius:10px}

.flash-wrap{padding:20px 16px 40px;max-width:460px;margin:0 auto}
.flip-wrap{perspective:1200px;margin-bottom:18px}
.flip-card{position:relative;width:100%;min-height:230px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;min-height:230px;transition:transform .45s;transform-style:preserve-3d}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-xl);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:var(--shadow-md)}
.flip-front{background:#fff;border:2px solid var(--border)}
.flip-back{background:linear-gradient(135deg,var(--sage-ink),var(--ok));color:#fff;transform:rotateY(180deg)}
.flip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink-faint);margin-bottom:12px}
.flip-back .flip-label{color:rgba(255,255,255,.75)}
.flip-text{font-size:19px;font-weight:700;white-space:pre-line;line-height:1.4;color:var(--ink)}
.flip-back .flip-text{color:#fff}
.flip-rule{font-size:11.5px;margin-top:14px;line-height:1.5;color:rgba(255,255,255,.9)}
.flip-ex{font-size:11.5px;margin-top:8px;font-style:italic;color:rgba(255,255,255,.8)}
.flash-actions{display:flex;gap:10px}
.flash-btn{flex:1;padding:15px;border-radius:var(--r-m);border:none;font-size:14px;font-weight:700;cursor:pointer}
.flash-btn.no{background:var(--bad-l);color:var(--bad)}
.flash-btn.yes{background:var(--ok-l);color:var(--ok)}
.flash-btn:active{transform:scale(.96)}

/* ══════════════════════════════════════════════════════════
   SIMULATOR — barra de tiempo
   ══════════════════════════════════════════════════════════ */
.sim-timer-bar{position:sticky;top:53px;z-index:40;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ola);color:#fff;font-weight:800;font-size:15px;padding:10px;letter-spacing:.5px}
.sim-timer-bar.warn{background:var(--bad)}

/* ══════════════════════════════════════════════════════════
   UTIL / EMPTY
   ══════════════════════════════════════════════════════════ */
.center-cta{padding:40px 20px;text-align:center}
.pill-btn{display:inline-block;background:var(--ola);color:#fff;border:none;border-radius:50px;padding:13px 24px;font-size:14px;font-weight:700;cursor:pointer}

/* ══════════════════════════════════════════════════════════
   EXAMEN OFICIAL telc (A2)
   ══════════════════════════════════════════════════════════ */
.exam-teil-title{font-size:15px;font-weight:800;margin:22px 16px 10px;color:var(--ink)}
.exam-teil-title:first-child{margin-top:16px}
.anweisung-box{background:var(--sky);border-left:4px solid var(--sky-ink);padding:12px 14px;border-radius:0 var(--r-m) var(--r-m) 0;margin:0 16px 14px;font-size:12.5px;color:var(--sky-ink);line-height:1.6}

<script>
/* ═══════════════════════════════════════════════════════════
   UTIL
   ═══════════════════════════════════════════════════════════ */
const Util = {
  shuffle(a){
    let b=[...a];
    for(let i=b.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [b[i],b[j]]=[b[j],b[i]];
    }
    return b;
  }
};

/* ═══════════════════════════════════════════════════════════
   STORE — progreso unificado en localStorage
   ═══════════════════════════════════════════════════════════ */
const Store = {
  KEY:'alodeutsch_progress_v1',
  data:null,
  load(){
    try{ this.data=JSON.parse(localStorage.getItem(this.KEY)||'{}'); }catch(e){ this.data={}; }
    if(!this.data.grammar) this.data.grammar={};
    if(!this.data.flashcards) this.data.flashcards={};
    if(!this.data.officialExam) this.data.officialExam={};
    if(!this.data.officialExam.answers) this.data.officialExam.answers={};
  },
  save(){ localStorage.setItem(this.KEY, JSON.stringify(this.data)); },
  gradeGrammar(id, ok){
    if(!this.data.grammar[id]) this.data.grammar[id]={c:0,t:0};
    this.data.grammar[id].t++;
    if(ok) this.data.grammar[id].c++;
    this.save();
  },
  flashProgress(deckKey, didKnow){
    if(!this.data.flashcards[deckKey]) this.data.flashcards[deckKey]={knew:0,total:0};
    this.data.flashcards[deckKey].total++;
    if(didKnow) this.data.flashcards[deckKey].knew++;
    this.save();
  },
  gradeOfficial(partKey, qId, ok){
    if(!this.data.officialExam.answers[partKey]) this.data.officialExam.answers[partKey]={};
    this.data.officialExam.answers[partKey][qId]=ok;
    this.save();
  },
  officialPartStats(partKey){
    const answers=this.data.officialExam.answers[partKey]||{};
    const vals=Object.values(answers);
    return { c: vals.filter(v=>v).length, t: vals.length };
  },
  resetProgress(){
    if(!confirm('¿Reiniciar TODO tu progreso guardado (Theorie, Quiz, Flashcards y examen oficial)? Esta acción no se puede deshacer.'))return;
    localStorage.removeItem(this.KEY);
    this.load();
    if(App.current==='dashboard') Route.render();
    App.toast('✅ Progreso reiniciado');
  }
};
Store.load();

const Progress = {
  levelPct(levelId){
    const lv=LEVELS[levelId];
    let tot=0,cor=0;
    lv.MODS.forEach(m=>{
      if(m.q){
        const s=Store.data.grammar[levelId+'-'+m.id]||{c:0,t:0};
        tot+=s.t; cor+=s.c;
      }
    });
    return tot>0?Math.round(cor/tot*100):0;
  }
};

/* ═══════════════════════════════════════════════════════════
   SPEECH — Web Speech API (de-DE) + Ola reacciona al hablar
   ═══════════════════════════════════════════════════════════ */
const Speech = {
  speaking:false,
  speak(text){
    if(!('speechSynthesis' in window)){
      App.toast('⚠️ Este navegador no soporta audio de voz.');
      return;
    }
    window.speechSynthesis.cancel();
    const utter=new SpeechSynthesisUtterance(text);
    utter.lang='de-DE';
    utter.rate=0.92;
    utter.pitch=1.05;
    const voices=window.speechSynthesis.getVoices();
    const deVoice = voices.find(v=>v.lang==='de-CH') || voices.find(v=>v.lang==='de-DE') || voices.find(v=>v.lang && v.lang.startsWith('de'));
    if(deVoice) utter.voice=deVoice;
    utter.onstart=()=>{ this.speaking=true; Ola.setSpeaking(true); };
    utter.onend=()=>{ this.speaking=false; Ola.setSpeaking(false); };
    utter.onerror=()=>{ this.speaking=false; Ola.setSpeaking(false); };
    window.speechSynthesis.speak(utter);
  },
  stop(){ window.speechSynthesis.cancel(); this.speaking=false; Ola.setSpeaking(false); }
};
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
}

/* ═══════════════════════════════════════════════════════════
   OLA — controlador del avatar-estrella (parpadeo, habla, celebración)
   ═══════════════════════════════════════════════════════════ */
const Ola = {
  els(){ return document.querySelectorAll('.ola-avatar'); },
  setSpeaking(on){ this.els().forEach(el=>el.classList.toggle('speaking',on)); },
  blink(){ this.els().forEach(el=>{ el.classList.add('blink'); setTimeout(()=>el.classList.remove('blink'),350); }); },
  celebrate(){ this.els().forEach(el=>{ el.classList.add('celebrate'); setTimeout(()=>el.classList.remove('celebrate'),700); }); },
  startIdleLoop(){
    setInterval(()=>{ if(!Speech.speaking) this.blink(); }, 6000+Math.random()*3000);
  }
};

/* ═══════════════════════════════════════════════════════════
   APP — router principal + banner permanente
   ═══════════════════════════════════════════════════════════ */
const Current = { levelId:null, modId:null, deckId:null };

const App = {
  stack:[],
  current:'welcome',
  subMap:{
    'welcome':'',
    'dashboard':'Deine Niveaus',
    'level':'',
    'module':'',
    'quiz-run':'',
    'flash-study':'Flashcards',
    'simulator':'',
    'a2-official-exam':'📝 Examen Oficial telc A2',
    'a2-official-part':''
  },
  go(id){
    this.stack.push(this.current);
    this.show(id);
  },
  show(id){
    document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
    const target=document.getElementById('scr-'+id);
    if(!target)return;
    target.classList.add('on');
    this.current=id;
    window.scrollTo(0,0);
    document.getElementById('banner-back').style.visibility = id==='welcome' ? 'hidden' : 'visible';
    const sub=this.subMap[id];
    document.getElementById('banner-sub').textContent = sub ? sub : 'Lernen mit Ola';
    if(id==='dashboard') Route.render();
  },
  goBack(){
    Speech.stop();
    if(this.current==='simulator') clearInterval(Simulator.timerId);
    const prev=this.stack.pop()||'welcome';
    this.show(prev);
  },
  goHome(){ this.stack=[]; this.show('welcome'); },
  toast(msg){
    const t=document.getElementById('toast');
    t.innerHTML=msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
  },

  /* ── Navegación de nivel (genérica, funciona para cualquier nivel registrado en LEVELS) ── */
  openLevel(id){
    const lv=LEVELS[id];
    if(!lv){ this.toast('🔒 Nivel disponible en la próxima actualización.'); return; }
    Current.levelId=id;
    this.go('level');
    document.getElementById('banner-sub').textContent=lv.label;
    LevelUI.switchTab(lv.tab||'theorie');
  },
  openModule(modId){
    Current.modId=modId;
    this.go('module');
    ModuleView.open(modId);
  },
  openQuizModule(modId){
    this.go('quiz-run');
    QuizRunUI.open(modId);
  },
  openDeck(deckId){
    Current.deckId=deckId;
    this.go('flash-study');
    FlashUI.open(deckId);
  }
};

/* ═══════════════════════════════════════════════════════════
   DASHBOARD — niveles disponibles
   ═══════════════════════════════════════════════════════════ */
const Route = {
  levels:[
    {icon:'🌱',title:'Nivel A1',sub:'Grundlagen · Theorie, Flashcards, Quiz y Übungstest',locked:false,id:'a1'},
    {icon:'🟢',title:'Nivel A2',sub:'Grundstufe · Theorie, Flashcards, Quiz y telc Simulator oficial',locked:false,id:'a2'},
    {icon:'🔵',title:'Nivel B1',sub:'Mittelstufe I · próximamente',locked:true},
    {icon:'🟣',title:'Nivel B2',sub:'Mittelstufe II · próximamente',locked:true},
    {icon:'💼',title:'B2–C1 Beruf',sub:'Alemán profesional · próximamente',locked:true}
  ],
  render(){
    const el=document.getElementById('route-path');
    el.innerHTML=this.levels.map(lv=>{
      if(lv.locked){
        return `<div class="route-node locked" onclick="App.toast('🔒 Nivel disponible en la próxima actualización.')">
          <div class="route-node-dot">${lv.icon}</div>
          <div class="route-node-body">
            <div class="route-node-top">
              <div class="route-node-title">${lv.title}<span class="lock-icon">🔒</span></div>
              <span class="route-node-tag locked">Bloqueado</span>
            </div>
            <div class="route-node-desc">${lv.sub}</div>
          </div>
        </div>`;
      }
      const pct=Progress.levelPct(lv.id);
      return `<div class="route-node" onclick="App.openLevel('${lv.id}')">
        <div class="route-node-dot">${lv.icon}</div>
        <div class="route-node-body">
          <div class="route-node-top">
            <div class="route-node-title">${lv.title}</div>
            <span class="route-node-tag active">Activo</span>
          </div>
          <div class="route-node-desc">${lv.sub}</div>
          <div class="route-node-prog-row">
            <div class="route-node-prog-bar"><div class="route-node-prog-fill" style="width:${pct}%"></div></div>
            <div class="route-node-prog-pct">${pct}%</div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
};

/* ═══════════════════════════════════════════════════════════
   QUIZ ENGINE — genérico, reutilizado por Quiz-por-módulo y Simulator
   ═══════════════════════════════════════════════════════════ */
const Quiz = {
  containerId:'',qq:[],qi:0,qs:0,qa:false,opts:{},_src:[],answers:[],
  el(){ return document.getElementById(this.containerId); },
  start(containerId, questions, opts={}){
    this.containerId=containerId;
    this._src=questions;
    this.qq = opts.keepOrder ? [...questions] : Util.shuffle(questions);
    this.qi=0;this.qs=0;this.qa=false;this.answers=[];
    this.opts=opts;
    this.renderQ();
  },
  renderQ(){
    if(this.qi>=this.qq.length){ this.showResults(); return; }
    const el=this.el();
    const q=this.qq[this.qi];
    this.qa=false;
    const pct=this.qi/this.qq.length*100;
    let h=`
      <div class="quiz-prog-row">
        <span class="quiz-counter">Pregunta ${this.qi+1} de ${this.qq.length}</span>
        <span class="quiz-live-score">✓ ${this.qs}/${this.qi}</span>
      </div>
      <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${pct}%"></div></div>
      <div class="q-card">
        <div class="q-type-label">${q.t==='mc'?'Opción múltiple':'Completa el espacio'}</div>
        <div class="q-text">${q.q}</div>
      </div>`;
    if(q.t==='mc'){
      h+=`<div class="qopts">`;
      Util.shuffle(q.o.map((o,i)=>({o,i}))).forEach(({o,i})=>{
        h+=`<button class="opt-btn" onclick="Quiz.answerMC(${i})" data-i="${i}">${o}</button>`;
      });
      h+=`</div>`;
    } else {
      h+=`<input type="text" class="fill-input qfill-input" placeholder="Escribe aquí..."
            autocomplete="off" autocorrect="off" autocapitalize="none"
            onkeydown="if(event.key==='Enter')Quiz.checkFill()">
          <button class="verify-btn" onclick="Quiz.checkFill()">Verificar</button>`;
    }
    h+=`<div class="qfb" style="display:none"></div>
        <button class="next-btn qnext" onclick="Quiz.next()" style="display:none">Siguiente →</button>`;
    el.innerHTML=h;
    if(q.t==='fill') setTimeout(()=>{ const f=el.querySelector('.qfill-input'); if(f) f.focus(); },100);
  },
  answerMC(chosen){
    if(this.qa)return;this.qa=true;
    const el=this.el();
    const q=this.qq[this.qi];
    const ok=chosen===q.a;
    if(ok)this.qs++;
    this.answers.push(ok);
    if(this.opts.scoreKey!=null) Store.gradeGrammar(this.opts.scoreKey, ok);
    el.querySelectorAll('.qopts .opt-btn').forEach(b=>{
      b.disabled=true;
      const i=parseInt(b.dataset.i);
      if(i===q.a) b.className='opt-btn correct';
      else if(i===chosen&&!ok) b.className='opt-btn wrong';
    });
    this.showFB(ok,q.x);
  },
  checkFill(){
    if(this.qa)return;
    const el=this.el();
    const inp=el.querySelector('.qfill-input');
    const val=inp.value.trim();
    if(!val)return;
    this.qa=true;
    const q=this.qq[this.qi];
    const ok=val.toLowerCase()===q.b.toLowerCase();
    if(ok){this.qs++;inp.className='fill-input qfill-input ok';}
    else{inp.className='fill-input qfill-input bad';inp.value=q.b;}
    this.answers.push(ok);
    inp.disabled=true;
    const vb=el.querySelector('.verify-btn'); if(vb) vb.disabled=true;
    if(this.opts.scoreKey!=null) Store.gradeGrammar(this.opts.scoreKey, ok);
    this.showFB(ok,q.x);
  },
  showFB(ok,exp){
    const el=this.el();
    const fb=el.querySelector('.qfb');
    fb.style.display='block';
    fb.className='qfb fb-box '+(ok?'ok':'bad');
    fb.innerHTML=`<div class="fb-head"><span class="fb-emoji">${ok?'✅':'❌'}</span><span class="fb-label ${ok?'ok':'bad'}">${ok?'¡Correcto!':'Incorrecto'}</span></div><div class="fb-exp">${exp}</div>`;
    el.querySelector('.qnext').style.display='block';
    if(ok) Ola.blink();
  },
  next(){ this.qi++; this.renderQ(); },
  showResults(){
    const el=document.getElementById(this.containerId);
    const pct=this.qq.length>0?Math.round(this.qs/this.qq.length*100):0;
    if(this.opts.onFinish){ this.opts.onFinish(this.qs,this.qq.length,pct); return; }
    const e=pct>=80?'🏆':pct>=60?'👍':'📚';
    const msg=pct>=80?'¡Excelente!':pct>=60?'¡Bien! Sigue practicando':'Repasa el tema e inténtalo de nuevo';
    if(pct>=60) Ola.celebrate();
    el.innerHTML=`

        <div class="results-emoji">${e}</div>
        <div class="results-score">${this.qs}/${this.qq.length}</div>
        <div class="results-pct" style="color:${pct>=80?'var(--ok)':pct>=60?'var(--butter-ink)':'var(--bad)'}">${pct}%</div>
        <div class="results-msg">${msg}</div>

};

/* ═══════════════════════════════════════════════════════════
   FLASHCARDS UI — estudio de mazos con flip 3D (genérico)
   ═══════════════════════════════════════════════════════════ */
const FlashUI = {
  current:null, queue:[], idx:0, knew:0, dknew:0, flipped:false, missedCards:[],
  open(deckId, onlyMissed=false){
    const lv=curLevel();
    this.current=lv.DECKS.find(d=>d.id===deckId);
    if(!this.current)return;
    this.storeKey=Current.levelId+'-deck-'+deckId;
    this.queue=Util.shuffle(onlyMissed && this.missedCards.length ? this.missedCards : [...this.current.cards]);
    this.idx=0;this.knew=0;this.dknew=0;this.flipped=false;
    if(!onlyMissed) this.missedCards=[];
    document.getElementById('banner-sub').textContent=this.current.e+' '+this.current.title;
    this.renderCard();
  },
  renderCard(){
    if(this.idx>=this.queue.length){ this.showResults(); return; }
    const card=this.queue[this.idx];
    this.flipped=false;
    const total=this.queue.length;
    document.getElementById('flash-body').innerHTML=`
      <div style="text-align:center;font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:10px">Tarjeta ${this.idx+1} de ${total} · ✓ ${this.knew}</div>
      <div class="flip-wrap" onclick="FlashUI.flip()">
        <div class="flip-card">
          <div class="flip-inner" id="flip-inner">
            <div class="flip-face flip-front">
              <div class="flip-label">${this.current.title}</div>
              <div class="flip-text">${card.f.replace(/\n/g,'<br>')}</div>
              <div style="font-size:11px;color:var(--ink-faint);margin-top:16px">Toca para ver la respuesta</div>
            </div>
            <div class="flip-face flip-back">
              <div class="flip-label">Respuesta</div>
              <div class="flip-text">${card.b.replace(/\n/g,'<br>')}</div>
              ${card.rule?`<div class="flip-rule">📌 ${card.rule}</div>`:''}
              ${card.ex?`<div class="flip-ex">• ${card.ex}</div>`:''}
            </div>
          </div>
        </div>
      </div>
      <div class="flash-actions" id="flash-actions" style="opacity:0;pointer-events:none;transition:opacity .25s">
        <button class="flash-btn no" onclick="FlashUI.answer(false)">✗ No sabía</button>
        <button class="flash-btn yes" onclick="FlashUI.answer(true)">✓ Sabía</button>
      </div>`;
  },
  flip(){
    const inner=document.getElementById('flip-inner');
    if(!inner)return;
    this.flipped=!this.flipped;
    inner.classList.toggle('flipped',this.flipped);
    const btns=document.getElementById('flash-actions');
    btns.style.opacity=this.flipped?'1':'0';
    btns.style.pointerEvents=this.flipped?'auto':'none';
  },
  answer(didKnow){
    if(!this.flipped)return;
    if(didKnow){ this.knew++; Ola.blink(); }
    else{ this.dknew++; this.missedCards.push(this.queue[this.idx]); }
    Store.flashProgress(this.storeKey, didKnow);
    setTimeout(()=>{ this.idx++; this.renderCard(); }, 250);
  },
  showResults(){
    const pct=this.queue.length>0?Math.round(this.knew/this.queue.length*100):0;
    const emoji=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'👍':'📚';
    const msg=pct>=90?'¡Perfecto! Dominas este mazo.':pct>=70?'¡Muy bien! Sigue practicando las difíciles.':pct>=50?'Buen progreso. Repasa las que no sabías.':'Sigue estudiando. Pronto lo dominarás.';
    if(pct>=70) Ola.celebrate();
    document.getElementById('flash-body').innerHTML=`
      <div class="results">
        <div class="results-emoji">${emoji}</div>
        <div style="font-weight:800;color:var(--ink);margin-bottom:4px">${this.current.e} ${this.current.title}</div>
        <div class="results-pct" style="color:${pct>=70?'var(--ok)':pct>=50?'var(--butter-ink)':'var(--bad)'}">${pct}%</div>
        <div class="results-msg">✓ ${this.knew} sabía · ✗ ${this.dknew} no sabía<br>${msg}</div>
        ${this.dknew>0?`<button class="results-btn-p" onclick="FlashUI.open(${this.current.id},true)">↺ Repasar las que fallé</button>`:''}
        <button class="results-btn-s" onclick="FlashUI.open(${this.current.id},false)">🔁 Repetir mazo completo</button>
      </div>`;
  }
};

/* ═══════════════════════════════════════════════════════════
   SIMULATOR — quiz rápido cronometrado, mezcla todos los módulos
   del nivel actual (genérico; no es el examen oficial telc)
   ═══════════════════════════════════════════════════════════ */
const Simulator = {
  timeLeft:0, timerId:null,
  start(){
    const lv=curLevel();
    const pool=[];
    lv.MODS.forEach(m=>{ if(m.q) pool.push(...m.q); });
    const picked=Util.shuffle(pool).slice(0,25);
    this.timeLeft=lv.simMinutes*60;
    this.duration=this.timeLeft;
    App.go('simulator');
    document.getElementById('banner-sub').textContent=lv.simLabel||'Simulator';
    document.getElementById('sim-timer-bar').className='sim-timer-bar';
    this.renderTimer();
    Quiz.start('sim-body', picked, {
      onFinish:(score,total,pct)=>{ this.finish(score,total,pct,false); }
    });
    clearInterval(this.timerId);
    this.timerId=setInterval(()=>this.tick(),1000);
  },
  renderTimer(){
    document.getElementById('sim-timer').textContent=this.fmt(this.timeLeft);
    if(this.timeLeft<=30) document.getElementById('sim-timer-bar').classList.add('warn');
  },
  tick(){
    this.timeLeft--;
    this.renderTimer();
    if(this.timeLeft<=0){
      clearInterval(this.timerId);
      const pct=Quiz.qq.length>0?Math.round(Quiz.qs/Quiz.qq.length*100):0;
      this.finish(Quiz.qs,Quiz.qq.length,pct,true);
    }
  },
  finish(score,total,pct,timeUp){
    clearInterval(this.timerId);
    const e=pct>=80?'🏆':pct>=60?'👍':'📚';
    const msg=(timeUp?'⏱️ Se acabó el tiempo. ':'')+(pct>=80?'¡Rendimiento excelente!':pct>=60?'Buen resultado, sigue repasando.':'Repasa los módulos con más errores antes de repetir.');
    if(pct>=60) Ola.celebrate();
    document.getElementById('sim-body').innerHTML=`
      <div class="results">
        <div class="results-emoji">${e}</div>
        <div class="results-score">${score}/${total}</div>
        <div class="results-pct" style="color:${pct>=80?'var(--ok)':pct>=60?'var(--butter-ink)':'var(--bad)'}">${pct}%</div>
        <div class="results-msg">${msg}</div>
        <button class="results-btn-p" onclick="Simulator.start()">↺ Repetir Simulator</button>
        <button class="results-btn-s" onclick="App.goBack()">← Volver al Nivel</button>
      </div>`;
  },
  fmt(s){ const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
};

  {f:'AKKUSATIV — Maskulinum\n¿Artículo definido?',b:'DEN',rule:'AKK M def: DEN (el único que cambia en AKK). Objeto directo. ¿Wen? / ¿Was?',ex:'Ich sehe DEN Mann. / Ich kaufe DEN Hund.'},

  {f:'DATIV — Femininum\n¿Artículo definido?',b:'DER',rule:'DAT F def: DER (= igual que NOM M, ¡cuidado!). ¿Wem?',ex:'Ich helfe DER Frau. / Ich danke DER Lehrerin.'},
  {f:'DATIV — Neutrum\n¿Artículo definido?',b:'DEM',rule:'DAT N def: DEM. Igual que DAT M.',ex:'Ich gebe DEM Kind ein Geschenk.'},
  {f:'AKKUSATIV — Maskulinum\n¿Artículo indefinido?',b:'EINEN',rule:'AKK M indef: EINEN. Solo el masculino cambia en AKK.',ex:'Ich sehe EINEN Mann. / Ich kaufe EINEN Hund.'},
  {f:'¿Solo qué artículo cambia\nen AKKUSATIV?',b:'EL MASCULINO:\nder → den / ein → einen',rule:'Femininum, Neutrum y Plural NO cambian en AKK. Solo M: der→den, ein→einen.',ex:'Ich sehe die Frau. / Ich sehe das Kind. (sin cambio) / Ich sehe DEN Mann. (cambio)'},

{id:13,e:'📐',title:'Wortstellung',sub:'Reglas de posición en la frase',color:'#2563eb',
cards:[
  {f:'REGLA ABSOLUTA:\n¿Qué va siempre en Pos.2?',b:'EL VERBO CONJUGADO\n(en toda Hauptsatz)',rule:'Pos.1 = cualquier elemento. Pos.2 = VERBO. Si Pos.1 ≠ sujeto → inversión.',ex:'Morgen fahre ich. / Deshalb bin ich. / Das Buch lese ich.'},
  {f:'INVERSIÓN:\n¿Cuándo ocurre?',b:'Cuando cualquier elemento\nque NO sea el sujeto va en Pos.1',rule:'Pos.1 (no sujeto) + VERBO + SUJETO + resto. V+S cambian de sitio.',ex:'Morgen (Pos1) FAHRE ich nach Wien. / Deshalb BIN ich geblieben.'},
  {f:'TEKAMOLO — ¿qué es?',b:'Temporal → Kausal → Modal → Lokal',rule:'Cuando hay varios complementos, este es el orden "natural" en alemán.',ex:'Ich fahre morgen (TE) wegen Arbeit (KA) mit dem Auto (MO) nach Berlin (LO).'},
  {f:'Nebensatz:\n¿dónde va el verbo?',b:'AL FINAL\n(después de todo lo demás)',rule:'Conector + Sujeto + Objetos + VERBO FINAL. Siempre al final en Nebensatz.',ex:'..., weil es regnet. / ..., dass er kommt. / ..., ob sie da ist.'},
  {f:'Modal en Hauptsatz:\n¿dónde van Modal e Infinitiv?',b:'Modal en Pos.2 / Infinitiv AL FINAL',rule:'Dos verbos en Hauptsatz: conjugado en Pos.2, infinitivo al final.',ex:'Ich kann nicht kommen. / Er muss früh aufstehen.'},
  {f:'NICHT — posición\nen la frase',b:'Al FINAL (de la parte que niega)',rule:'Regla general: nicht tiende al final. Antes de infinitivo, P.II, adjetivo predicativo.',ex:'Ich komme nicht. / Ich kann nicht kommen. / Ich bin nicht müde.'},
  {f:'kein vs nicht:\n¿cuándo usar cada uno?',b:'kein + Nomen (sin artículo definido)\nnicht + todo lo demás',rule:'kein sustituye a nicht + ein. Ich habe kein Auto (= nicht ein Auto).',ex:'Ich habe kein Auto. / Ich trinke keinen Kaffee. / Ich komme nicht.'}

        {"sprecher":"Du","text":"Ausserdem ist die Heizung kaputt und ich friere. Das Zimmer ist sehr kalt. Wäre es möglich, ein anderes Zimmer zu bekommen?"},
        {"sprecher":"Rezeptionist","text":"Natürlich! Wir haben noch Zimmer 305 frei — mit Balkon und funktionierender Heizung."},
        {"sprecher":"Du","text":"Das wäre sehr nett, vielen Dank! Können Sie mir helfen, das Gepäck umzuziehen?"},
        {"sprecher":"Rezeptionist","text":"Selbstverständlich! Ich schicke sofort jemanden."}
      ],
      "frasen": ["Para quejarte: Ich habe ein Problem mit... / Es gibt ein Problem mit...","Para pedir algo: Könnten Sie...? / Wäre es möglich, ...zu...?","Para agradecer: Das wäre sehr nett! / Vielen Dank!","Para preguntar: Haben Sie...? / Gibt es...?","Si no entiendes: Könnten Sie das bitte wiederholen? / Langsamer bitte!"]
    }
  }
};

/* ═══════════════════════════════════════════════════════════
   OfficialExamA2 — controlador del examen oficial telc A2
   ═══════════════════════════════════════════════════════════ */
const OfficialExamA2 = {
  PARTS:[
    {key:'hoeren',icon:'🎧',title:'Hören',sub:'3 Teile · Aufgaben 1–15',graded:true,total:15},
    {key:'lesen',icon:'📖',title:'Lesen',sub:'3 Teile · Aufgaben 1–15',graded:true,total:15},
    {key:'schreiben',icon:'✍️',title:'Schreiben',sub:'2 Aufgaben · Referencia',graded:false},
    {key:'sprechen',icon:'💬',title:'Sprechen',sub:'3 Teile · Referencia',graded:false}
  ],
  open(){
    App.go('a2-official-exam');
    document.getElementById('banner-sub').textContent='📝 Examen Oficial telc A2';
    this.renderHome();
  },
  renderHome(){
    let gradedCorrect=0, gradedTotal=0;
    this.PARTS.forEach(p=>{
      if(!p.graded)return;
      const s=Store.officialPartStats('a2-'+p.key);
      gradedCorrect+=s.c; gradedTotal+=s.t;
    });
    const pct = gradedTotal>0 ? Math.round(gradedCorrect/gradedTotal*100) : null;
    let h=`<div class="intro-box" style="margin:14px 16px 0">
      <b>Modellprüfung real telc A2</b> — Hörverstehen y Leseverstehen (con audio generado en tu dispositivo, de-DE)
      se autocalifican al instante. Schriftlicher y Mündlicher Ausdruck quedan maquetados como guía visual de
      referencia con respuestas modelo, ya que un texto libre o una conversación oral no se pueden calificar automáticamente.
    </div>`;
    if(pct!==null){
      h+=`<div class="exam-score-pill" style="margin:14px 16px 0">
        <span>Puntaje acumulado (partes calificables)</span>
        <b>${gradedCorrect}/${gradedTotal} · ${pct}%</b>
      </div>`;
    }
    h+=`<div class="mod-grid" style="margin:16px">`;
    h+=this.PARTS.map(p=>{
      const s=p.graded?Store.officialPartStats('a2-'+p.key):null;
      const badge=(s&&s.t>0)?`<span class="mod-score">${s.c}/${s.t}</span>`:(p.graded?'':'<span class="mod-score" style="background:var(--lav);color:var(--lav-ink)">Referencia</span>');
      return `<div class="mod-card" onclick="OfficialExamA2.openPart('${p.key}')">
        <div class="mod-card-top"><span class="mod-emoji">${p.icon}</span>${badge}</div>
        <div class="mod-title">${p.title}</div>
        <div class="mod-sub">${p.sub}</div>
      </div>`;
    }).join('');
    h+=`</div>`;
    document.getElementById('a2-official-home-body').innerHTML=h;
  },

  openPart(key){
    App.go('a2-official-part');
    const p=this.PARTS.find(x=>x.key===key);
    document.getElementById('banner-sub').textContent=p.icon+' '+p.title;
    const body=document.getElementById('a2-official-part-body');
    body.innerHTML='';
    if(key==='hoeren') this.renderHoeren(body);
    if(key==='lesen') this.renderLesen(body);
    if(key==='schreiben') this.renderSchreiben(body);
    if(key==='sprechen') this.renderSprechen(body);
    const back=document.createElement('button');
    back.className='results-btn-s';
    back.style.margin='18px 16px 30px';
    back.style.width='calc(100% - 32px)';
    back.textContent='← Volver al Examen Oficial';
    back.onclick=()=>OfficialExamA2.open();
    body.appendChild(back);
  },

  el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e; },

  renderHoeren(container){
    const data=OFFICIAL_EXAM_A2.hoeren;
    container.appendChild(this.el('div','anweisung-box','🔊 Cada audio se genera con la voz alemana de tu dispositivo (Web Speech API, de-DE). Pulsa "Escuchar" y sigue la transcripción — así entrenas oído y ojo a la vez.'));

    const t1=data.teil1;
    container.appendChild(this.el('div','exam-teil-title',t1.titel));
    container.appendChild(this.el('div','anweisung-box',t1.anweisung));
    t1.texte.forEach(txt=>{
      const tCard=this.el('div','text-card');
      const safe=txt.transcript.replace(/'/g,"\\'").replace(/\n/g,' ');
      tCard.innerHTML=`<span class="sprecher-tag">${txt.sprecher}</span>
        <button class="exam-audio-btn" onclick="Speech.speak('${safe}')">🔊 Escuchar</button>
        <div class="text-card-body">${txt.transcript.replace(/\n/g,'<br>')}</div>`;
      container.appendChild(tCard);
      const qCard=this.el('div','q-card',`<span class="q-num">${txt.nummer}</span><span class="q-text">${txt.frage}</span>`);
      const mc=this.el('div','mc-abc');
      Object.entries(txt.optionen).forEach(([letra,texto])=>{
        const opt=this.el('div','mc-opt');
        opt.innerHTML=`<span class="mc-letter">${letra}</span><span>${texto}</span>`;
        opt.onclick=()=>OfficialExamA2.answerMC(txt.nummer,letra,txt.loesung,mc,'hoeren');
        mc.appendChild(opt);
      });
      qCard.appendChild(mc);
      container.appendChild(qCard);
    });

    const t2=data.teil2;
    container.appendChild(this.el('div','exam-teil-title',t2.titel));
    container.appendChild(this.el('div','anweisung-box',t2.anweisung));
    container.appendChild(this.el('div','anweisung-box','<i>'+t2.einleitung+'</i>'));
    const dialogText=t2.dialog.map(d=>d.sprecher+': '+d.text).join('. ').replace(/'/g,"\\'").replace(/\n/g,' ');
    const dialogCard=this.el('div','text-card');
    const dialogHtml=t2.dialog.map(d=>`<b>${d.sprecher}:</b> ${d.text}`).join('<br><br>');
    dialogCard.innerHTML=`<div class="text-card-title">Telefongespräch</div>
      <button class="exam-audio-btn" onclick="Speech.speak('${dialogText}')">🔊 Escuchar diálogo completo</button>
      <div class="text-card-body">${dialogHtml}</div>`;
    container.appendChild(dialogCard);
    t2.aufgaben.forEach(a=>{
      const qCard=this.el('div','q-card',`<span class="q-num">${a.nummer}</span><span class="q-text">${a.text}</span>`);
      const rf=this.el('div','rf-row');
      const rBtn=this.el('button','rf-btn richtig','richtig'), fBtn=this.el('button','rf-btn falsch','falsch');
      rBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'richtig',a.loesung,rBtn,fBtn,null,'hoeren');
      fBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'falsch',a.loesung,rBtn,fBtn,null,'hoeren');
      rf.appendChild(rBtn); rf.appendChild(fBtn);
      qCard.appendChild(rf);
      container.appendChild(qCard);
    });

    const t3=data.teil3;
    container.appendChild(this.el('div','exam-teil-title',t3.titel));
    container.appendChild(this.el('div','anweisung-box',t3.anweisung));
    t3.texte.forEach(txt=>{
      const tCard=this.el('div','text-card');
      const safe=txt.transcript.replace(/'/g,"\\'").replace(/\n/g,' ');
      tCard.innerHTML=`<span class="sprecher-tag">${txt.sprecher}</span>
        <button class="exam-audio-btn" onclick="Speech.speak('${safe}')">🔊 Escuchar</button>
        <div class="text-card-body">${txt.transcript}</div>`;
      container.appendChild(tCard);
      const qCard=this.el('div','q-card',`<span class="q-num">${txt.nummer}</span><span class="q-text">${txt.frage}</span>`);
      const mc=this.el('div','mc-abc');
      Object.entries(txt.optionen).forEach(([letra,texto])=>{
        const opt=this.el('div','mc-opt');
        opt.innerHTML=`<span class="mc-letter">${letra}</span><span>${texto}</span>`;
        opt.onclick=()=>OfficialExamA2.answerMC(txt.nummer,letra,txt.loesung,mc,'hoeren');
        mc.appendChild(opt);
      });
      qCard.appendChild(mc);
      container.appendChild(qCard);
    });
  },

  renderLesen(container){
    const data=OFFICIAL_EXAM_A2.lesen;

    const t1=data.teil1;
    container.appendChild(this.el('div','exam-teil-title',t1.titel));
    container.appendChild(this.el('div','anweisung-box',t1.anweisung));
    t1.anzeigen.forEach(anz=>{
      const card=this.el('div','text-card');
      card.innerHTML=`<div class="text-card-title">${anz.titel}</div><div class="text-card-body">${anz.text}</div>`;
      container.appendChild(card);
    });
    t1.aufgaben.forEach(a=>{
      const qCard=this.el('div','q-card',`<span class="q-num">${a.nummer}</span><span class="q-text">${a.text}</span>`);
      const rf=this.el('div','rf-row');
      const rBtn=this.el('button','rf-btn richtig','Richtig'), fBtn=this.el('button','rf-btn falsch','Falsch');
      rBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'richtig',a.loesung,rBtn,fBtn,null,'lesen');
      fBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'falsch',a.loesung,rBtn,fBtn,null,'lesen');
      rf.appendChild(rBtn); rf.appendChild(fBtn);
      qCard.appendChild(rf);
      container.appendChild(qCard);
    });

    const t2=data.teil2;
    container.appendChild(this.el('div','exam-teil-title',t2.titel));
    container.appendChild(this.el('div','anweisung-box',t2.anweisung));
    const textCard=this.el('div','text-card');
    textCard.innerHTML=`<div class="text-card-title">${t2.text_titel}</div><div class="text-card-body">${t2.text.replace(/\n\n/g,'<br><br>')}</div>`;
    container.appendChild(textCard);
    t2.aufgaben.forEach(a=>{
      const card=this.el('div','q-card',`<span class="q-num">${a.nummer}</span><span class="q-text">${a.frage}</span>`);
      const mc=this.el('div','mc-abc');
      Object.entries(a.optionen).forEach(([letra,texto])=>{
        const opt=this.el('div','mc-opt');
        opt.innerHTML=`<span class="mc-letter">${letra}</span><span>${texto}</span>`;
        opt.onclick=()=>OfficialExamA2.answerMC(a.nummer,letra,a.loesung,mc,'lesen');
        mc.appendChild(opt);
      });
      card.appendChild(mc);
      container.appendChild(card);
    });

    const t3=data.teil3;
    container.appendChild(this.el('div','exam-teil-title',t3.titel));
    container.appendChild(this.el('div','anweisung-box',t3.anweisung));
    const emailCard=this.el('div','text-card');
    emailCard.innerHTML=`<div class="text-card-title">${t3.email_titel}</div><div class="text-card-body">${t3.email_text.replace(/\n/g,'<br>')}</div>`;
    container.appendChild(emailCard);
    t3.aufgaben.forEach(a=>{
      const qCard=this.el('div','q-card',`<span class="q-num">${a.nummer}</span><span class="q-text">${a.text}</span>`);
      const rf=this.el('div','rf-row');
      const rBtn=this.el('button','rf-btn richtig','Richtig'), fBtn=this.el('button','rf-btn falsch','Falsch'), nBtn=this.el('button','rf-btn na','Nicht im Text');
      rBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'richtig',a.loesung,rBtn,fBtn,nBtn,'lesen');
      fBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'falsch',a.loesung,rBtn,fBtn,nBtn,'lesen');
      nBtn.onclick=()=>OfficialExamA2.answerRF(a.nummer,'na',a.loesung,rBtn,fBtn,nBtn,'lesen');
      rf.appendChild(rBtn); rf.appendChild(fBtn); rf.appendChild(nBtn);
      qCard.appendChild(rf);
      container.appendChild(qCard);
    });
  },

  answerMC(num,chosen,loesung,mcDiv,partKey){
    if(mcDiv.dataset.answered)return;
    mcDiv.dataset.answered='1';
    const ok=chosen===loesung;
    Array.from(mcDiv.children).forEach(opt=>{
      const letra=opt.querySelector('.mc-letter').textContent;
      if(letra===loesung) opt.classList.add('correct');
      else if(letra===chosen) opt.classList.add('wrong');
      opt.style.pointerEvents='none';
    });
    if(ok) Ola.blink();
    Store.gradeOfficial('a2-'+partKey, partKey[0]+num, ok);
  },
  answerRF(num,chosen,loesung,rBtn,fBtn,nBtn,partKey){
    if(rBtn.dataset.answered)return;
    rBtn.dataset.answered='1'; fBtn.dataset.answered='1'; if(nBtn)nBtn.dataset.answered='1';
    const ok=chosen===loesung;
    rBtn.style.pointerEvents='none'; fBtn.style.pointerEvents='none'; if(nBtn)nBtn.style.pointerEvents='none';
    const btnFor={richtig:rBtn,falsch:fBtn,na:nBtn};
    const correctBtn=btnFor[loesung];
    if(correctBtn) correctBtn.classList.add('correct');
    if(!ok){ const chosenBtn=btnFor[chosen]; if(chosenBtn) chosenBtn.classList.add('wrong'); }
    if(ok) Ola.blink();
    Store.gradeOfficial('a2-'+partKey, partKey[0]+num, ok);
  },

  renderSchreiben(container){
    const data=OFFICIAL_EXAM_A2.schriftlich;

    const a1=data.aufgabe1;
    container.appendChild(this.el('div','exam-teil-title',a1.titel));
    container.appendChild(this.el('div','anweisung-box',a1.anweisung));
    const felderCard=this.el('div','text-card');
    felderCard.innerHTML=a1.felder.map(f=>`<div class="punkt-item">• ${f}</div>`).join('');
    container.appendChild(felderCard);
    container.appendChild(this.el('div','anweisung-box','<i>'+a1.hinweis+'</i>'));

    const a2=data.aufgabe2;
    container.appendChild(this.el('div','exam-teil-title',a2.titel));
    container.appendChild(this.el('div','anweisung-box',`<b>${a2.situation}</b>`));
    container.appendChild(this.el('div','anweisung-box',a2.anweisung));
    const puntosCard=this.el('div','text-card');
    puntosCard.innerHTML=a2.punkte.map(p=>`<div class="punkt-item">• ${p}</div>`).join('');
    container.appendChild(puntosCard);

    const ta=this.el('textarea','schreib-textarea');
    ta.id='oea2-schreiben-textarea';
    ta.placeholder='Liebe Sarah,\n\n...';
    ta.value=Store.data.officialExam.schreibTextA2||'';
    container.appendChild(ta);
    const counter=this.el('div','word-counter','0 Wörter (Ziel: 40–60)');
    counter.id='oea2-word-counter';
    container.appendChild(counter);
    const update=()=>{
      const words=ta.value.trim().split(/\s+/).filter(w=>w.length>0);
      counter.textContent=words.length+' Wörter (Ziel: 40–60)';
      Store.data.officialExam.schreibTextA2=ta.value;
      Store.save();
    };
    ta.addEventListener('input',update);
    update();

    const showBtn=this.el('button','results-btn-s','✨ Ver respuesta modelo');
    showBtn.style.margin='4px 16px 0';
    const modelCard=this.el('div','text-card');
    modelCard.style.display='none';
    modelCard.style.marginTop='10px';
    modelCard.innerHTML=`<div class="text-card-title">Respuesta modelo</div>
      <div class="text-card-body">${a2.musterloesung.replace(/\n/g,'<br>')}</div>
      <div style="margin-top:10px;font-size:11.5px;color:var(--ink-soft);line-height:1.7">${a2.grammatik_notas.map(n=>'✓ '+n).join('<br>')}</div>`;
    showBtn.onclick=()=>{ modelCard.style.display='block'; showBtn.style.display='none'; };
    container.appendChild(showBtn);
    container.appendChild(modelCard);
  },

  renderSprechen(container){
    const data=OFFICIAL_EXAM_A2.muendlich;
    container.appendChild(this.el('div','anweisung-box','<b>ca. 15 Minuten</b> · Material de referencia para practicar en voz alta con un compañero o profesor — no se autocalifica.'));

    [data.teil1,data.teil2].forEach(teil=>{
      container.appendChild(this.el('div','exam-teil-title',teil.titel));
      container.appendChild(this.el('div','anweisung-box',teil.anweisung));
      teil.fragen.forEach(f=>{
        const card=this.el('div','q-card');
        const safe=f.antwort.replace(/'/g,"\\'").replace(/\n/g,' ');
        card.innerHTML=`<div class="q-text" style="margin-bottom:8px">❓ ${f.frage}</div>`;
        const showBtn=this.el('button','results-btn-s','Ver respuesta modelo');
        const modelBox=this.el('div','zitat-card');
        modelBox.style.display='none';
        modelBox.style.marginTop='10px';
        modelBox.innerHTML=`<div class="zitat-text">${f.antwort}</div>
          <button class="exam-audio-btn" style="margin-top:8px" onclick="Speech.speak('${safe}')">🔊 Escuchar</button>
          <div style="margin-top:8px;font-size:11px;color:var(--ink-soft)">💡 ${f.tip}</div>`;
        showBtn.onclick=()=>{ modelBox.style.display='block'; showBtn.style.display='none'; };
        card.appendChild(showBtn);
        card.appendChild(modelBox);
        container.appendChild(card);
      });
    });

    const t3=data.teil3;
    container.appendChild(this.el('div','exam-teil-title',t3.titel));
    container.appendChild(this.el('div','anweisung-box',t3.anweisung));
    container.appendChild(this.el('div','anweisung-box','<b>'+t3.situation+'</b>'));
    const dialogCard=this.el('div','text-card');
    const dialogHtml=t3.dialog_modell.map(l=>`<b>${l.sprecher}:</b> ${l.text}`).join('<br><br>');
    const dialogSafe=t3.dialog_modell.map(l=>l.sprecher+': '+l.text).join('. ').replace(/'/g,"\\'");
    dialogCard.innerHTML=`<div class="text-card-title">Diálogo modelo</div>
      <button class="exam-audio-btn" onclick="Speech.speak('${dialogSafe}')">🔊 Escuchar diálogo</button>
      <div class="text-card-body">${dialogHtml}</div>`;
    container.appendChild(dialogCard);
    const frasenCard=this.el('div','text-card');
    frasenCard.innerHTML=`<div class="text-card-title">Frases útiles</div><div class="text-card-body" style="font-size:12px">${t3.frasen.map(f=>'• '+f).join('<br>')}</div>`;
    container.appendChild(frasenCard);
  }
};
