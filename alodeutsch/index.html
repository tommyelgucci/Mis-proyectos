<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alodeutsch</title>
</head>
<body>
<p>Cargando Alodeutsch… <a href="alodeutsch.html">Abrir la app directamente</a>.</p>
<script>
fetch('./alodeutsch.html').then(response => {
  if (!response.ok) throw new Error('No se pudo abrir la app');
  return response.text();
}).then(html => {
  const lessonSlot = 'if(l.id===11) h+=L11AudioPractice.render()+L11Tenses.render();';
  const introEnd = '    </div>\n    <div class="exam-score-pill"';
  const screenSlot = '<div id="scr-b1-official-exam" class="scr">';
  const navSlot = "    'b1-lesson':'',";
  const levelSlot = "    h+=`<div class=\"grid-label\">${lv.MODS.length} ${Lang.td('lvl.mods','Módulos de Gramática')}</div><div class=\"mod-grid\">`;";
  if (![lessonSlot,introEnd,screenSlot,navSlot,levelSlot].every(slot=>html.includes(slot))) throw new Error('Versión inesperada');
  html = html.replace(lessonSlot, lessonSlot + ' h+=`<div class="intro-box" style="margin-top:20px"><h3>⚡ Repaso de C y D</h3><p>12 preguntas sobre expresiones, tráfico e In der Fremde.</p>${L11FastReview.render()}</div>`;');
  html = html.replace(introEnd, '      <p><a href="./ALOdeutsch_TELC_B1_Trainer.html" target="_blank" rel="noopener">🎯 Abrir entrenador telc B1 actualizado</a></p>\n' + introEnd);
  html = html.replace(screenSlot, '<div id="scr-b2-lessons" class="scr"><div id="b2-lessons-body" style="padding-bottom:30px"></div></div>\n<div id="scr-b2-lesson" class="scr"><div id="b2-lesson-body" class="study-body" style="padding-top:14px;padding-bottom:30px"></div></div>\n<div id="scr-b22-lessons" class="scr"><div id="b22-lessons-body" class="study-body" style="padding-bottom:30px"></div></div>\n<div id="scr-b22-lesson" class="scr"><div id="b22-lesson-body" class="study-body" style="padding-top:14px;padding-bottom:30px"></div></div>\n<div id="scr-c11-lessons" class="scr"><div id="c11-lessons-body" class="study-body" style="padding-bottom:30px"></div></div>\n<div id="scr-c11-lesson" class="scr"><div id="c11-lesson-body" class="study-body" style="padding-top:14px;padding-bottom:30px"></div></div>\n' + screenSlot);
  html = html.replace(navSlot, navSlot + "\n    'b2-lessons':'📚 Sicher! B2.1 · Lektionen 1–6',\n    'b2-lesson':'',\n    'b22-lessons':'📚 Sicher! B2.2 · Lektionen 7–12',\n    'b22-lesson':'',\n    'c11-lessons':'📘 Sicher! C1 · Lektionen 1–12',\n    'c11-lesson':'',");
  html = html.replace(levelSlot, "    if(Current.levelId==='b2') h+=`<div class=\"center-cta\" style=\"margin:12px 16px 18px;padding:24px 18px\"><h2>Sicher! B2.1 · Lektionen 1–6</h2><button class=\"pill-btn\" onclick=\"B2Lessons.open()\">${Lang.current==='en'?'Open lessons →':'Abrir lecciones →'}</button></div>`;\n    if(Current.levelId==='b2') h+=B22Lessons.banner();\n    if(Current.levelId==='b2c1') h+=C11Lessons.banner();\n" + levelSlot);
  html = html.replace('<script>', '<script src="./l11-quick-review.js"></' + 'script>\n<script>');
  for (const path of ['b1-class-practice.js','b2-sicher-lessons.js','b22-sicher-lessons.js','b2-lesson-practice.js','b2-guided-study.js','c11-sicher-lessons.js','c12-sicher-lessons.js','b1-kahoot-mixed-review.js','b1-uebungstests-4-5.js','game-expansion.js','placement-expansion.js']) {
    html = html.replace('</body>', '<script src="./' + path + '"></' + 'script>\n</body>');
  }
  document.open();
  document.write(html);
  document.close();
}).catch(() => {
  document.body.innerHTML = '<p>No se pudo cargar el repaso. <a href="alodeutsch.html">Abrir ALOdeutsch</a>.</p>';
});
</script>
</body>
</html>
