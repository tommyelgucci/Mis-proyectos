    .examNav{display:flex;gap:7px;overflow:auto;margin:10px 0 18px}.examNav button{white-space:nowrap;background:#142238;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 11px}.examNav button.active{color:#081018;background:var(--yellow);border-color:var(--yellow)}.reading{background:#f6f0df;color:#15191f;padding:18px;border-radius:14px;white-space:pre-line}.reading h3{color:#15191f}.reading p{color:#303947}.headings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;font-size:.9rem}.headings div{background:#e5dcc6;padding:8px;border-radius:8px}.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--yellow)}

<script>
const TELC_DATA={"official":{"leseverstehen":{"teil1":{"titel":"Leseverstehen Teil 1","anweisung":"Lesen Sie die Überschriften a-j und die Texte 1-5. Finden Sie für jeden Text die passende Überschrift. Sie können jede Überschrift nur einmal benutzen.","ueberschriften":{"a":"Immer mehr deutsche Familien reisen mit der Bahn","b":"Buchtipp: Hilfe bei Schlafproblemen","c":"Der Computer: Liebstes Hobby von Deutschlands Frauen","d":"Neu bei der Bahn: Spezielle Informationen und Angebote für Radfahrer","e":"Neu am Markt: Billige Schlaftabletten","f":"Familien reisen billiger","g":"Urlaub mit dem Fahrrad in Deutschland immer beliebter","h":"Kultur im Urlaub: Interessen je nach Alter unterschiedlich","i":"Umfrage: Wer verwendet den Computer am häufigsten?","j":"Deutschland: Immer mehr Touristen reisen in den Westen"},"texte":[{"nummer":1,"text":"Wer ist der typische Computerfan? Das B.A.T. Freizeitforschungsinstitut Hamburg ermittelte einige Eigenschaften: Er ist männlich, jung und hat einen höheren Schulabschluss. Bei der Beschäftigung am heimischen Computer stehen Textverarbeitung und Spiele ganz oben, es folgen private Buchhaltung, Grafikprogramme und Tabellenkalkulation.","loesung":"i"},{"nummer":2,"text":"'Bahn&Bike' heisst ein 222-seitiger Prospekt, den die Deutsche Bahn AG in Zusammenarbeit mit der Deutschen Zentrale für Tourismus herausgebracht hat und der wichtige Informationen für jene bereitstellt, die ihren Radurlaub mit Bahnfahren verbinden wollen. Das Motto lautet: Hin mit der Bahn - das Rad vor Ort mieten. Der Prospekt enthält Angaben zur Streckenlänge und Wegbeschaffenheit, Adressen von Verleihstationen, verweist auf Sehenswürdigkeiten sowie Unterkünfte und wird durch Karten ergänzt. Die Broschüre kostet 5 Euro und ist im Buchhandel beziehungsweise an Fahrkartenschaltern zu beziehen.","loesung":"d"},{"nummer":3,"text":"Ausführliche Informationen zum Thema 'Schlafstörungen' finden Sie im gleichnamigen Patientenratgeber von Dr. med. Fritz Hohagen. Sie erfahren, was den Schlaf stört und was Sie dagegen unternehmen können. Für 9,95 Euro erhalten Sie das Buch in Apotheken oder direkt beim Wort&Bild Verlag, 82065 Baierbrunn.","loesung":"b"},{"nummer":4,"text":"Jetzt wird für Familien Reisen mit der Bahn zwischen Österreich und Deutschland noch ein gutes Stück günstiger. Denn ab 6. Oktober gibt es den Familien-Super-Sparpreis. Ein echter Traumpreis für die ganze Familie - vom Baby bis zum Grosspapa - da kann man wirklich sparen. Der Familien-Super-Sparpreis gilt für Familien, bestehend aus ein oder zwei Erwachsenen (Eltern, auch Grosseltern) und deren Kindern/Enkelkindern bis zum vollendeten 17. Lebensjahr, wobei mindestens ein Kind/Enkelkind an der Reise teilnehmen muss.","loesung":"f"},{"nummer":5,"text":"Touristen zwischen 14 und 29 Jahren sowie zwischen 40 und 49 Jahren haben ein besonders grosses Interesse an der Kultur des jeweiligen Reiselandes, während die Gruppe der 30- bis 39-jährigen im Urlaub 'eine Kulturpause einlegt'. Dies geht aus der neuesten Analyse der Forschungsgemeinschaft Urlaub und Reisen e.V. hervor. Urlauber aus Ostdeutschland, so die Studie, zeigen wiederum mehr Kulturinteresse als Reisende aus dem Westen. Grundsätzlich gelte: Je höher das Einkommen und die Schulbildung sind, umso mehr besteht im Urlaub der Wunsch, Land und Leute kennenzulernen.","loesung":"h"}]},"teil2":{"titel":"Leseverstehen Teil 2","anweisung":"Lesen Sie den Text und die Aufgaben 6-10. Welche Lösung (a, b oder c) ist jeweils richtig?","text_titel":"Büro-Werkstatt: Chance für behinderte Menschen","text_untertitel":"Computerarbeit im Auftrag privater Firmen - jeder Dritte findet nach einem fünfmonatigen Kurs einen Job. Interessierte Unternehmen werden noch gesucht.","text":"Margit, die junge Frau im Rollstuhl, erledigt die Lohnverrechnung für einen Verlag. Reinhard, seit der Geburt gehbehindert, tippt für die Direktion von Hewlett Packard Protokolle und Preislisten. Martin, seine Unterarme sind verkürzt, layoutet die Speisekarte eines Wiener Restaurants.\n\nDrei junge körperbehinderte Menschen am Computer - alle drei können auf eine abgeschlossene kaufmännische Ausbildung verweisen. Dennoch hat man sie auf dem Arbeitsamt als 'schwer vermittelbar' eingestuft - was de facto nicht vermittelbar bedeutet. Zurzeit arbeiten Margit, Reinhard und Martin - gemeinsam mit sieben anderen behinderten Menschen - in der 'Büro-Werkstatt' in Wien-Stadlau. Hier werden körperbehinderte Schulabgänger auf das Berufsleben vorbereitet. In einem fünfmonatigen Kurs lernen sie, das in der Schule Gelernte in die Praxis umzusetzen. Ihre Dienste werden von Privatfirmen (darunter auch die OMV und zwei Banken) zugekauft.\n\nGleichzeitig wird ihnen bei der Jobsuche geholfen. 'Leicht ist das nicht', sagt Betreuer Günther Hos. 'Es gibt so viele Arbeitslose, die nicht behindert sind. Wer nimmt schon einen Mitarbeiter mit Handicap?' Zwar wären die Firmen gesetzlich verpflichtet, pro 25 Beschäftigte einen Behinderten einzustellen. Die meisten Firmen nützen jedoch die Möglichkeit, sich 'freizukaufen' (die sogenannte 'Ausgleichstaxe' beträgt rund 150 Euro monatlich).\n\nTrotz der Rahmenbedingungen kann Hos mit einer durchaus positiven Bilanz aufwarten: 'Immerhin haben wir seit der Vereinsgründung vor drei Jahren ein Drittel unserer Leute untergebracht.' Auch ein Dienst an der Allgemeinheit, denn jede Vermittlung bedeutet: ein Arbeitsloser weniger, ein Steuerzahler mehr.\n\nGegründet wurde die Büro-Werkstatt von einer Lehrerin: Heide Hanisch, die in einer Wiener berufsbildenden Schule Geografie und Geschichte unterrichtet, wollte nicht länger hinnehmen, dass ihre behinderten Schüler erst ausgebildet werden, um dann als Arbeitnehmer nicht gebraucht zu werden.","aufgaben":[{"nummer":6,"frage":"In einem fünfmonatigen Kurs können die Teilnehmer","optionen":{"a":"eine berufliche Ausbildung abschliessen.","b":"lernen, was sie in der Schule verpasst haben.","c":"praktische Erfahrungen mit der Büroarbeit sammeln."},"loesung":"c"},{"nummer":7,"frage":"Die Büro-Werkstatt versucht ausserdem,","optionen":{"a":"auch jenen Arbeitslosen zu helfen, die nicht behindert sind.","b":"Behinderte auf die Abschlussprüfungen vorzubereiten.","c":"für die behinderten Menschen eine Arbeit zu finden."},"loesung":"c"},{"nummer":8,"frage":"Laut Gesetz müssen österreichische Firmen pro 25 Beschäftigte","optionen":{"a":"eine besondere Steuer zahlen.","b":"einen Behinderten einstellen oder eine monatliche Gebühr bezahlen.","c":"für jeden Behinderten monatlich 150 Euro bezahlen."},"loesung":"b"},{"nummer":9,"frage":"Seit der Vereinsgründung","optionen":{"a":"konnte für ein Drittel der behinderten Kursteilnehmer eine Arbeit gefunden werden.","b":"konnte Günther Hos für den Verein schon viel Geld sparen.","c":"zahlen Arbeitslose um ein Drittel weniger Steuern."},"loesung":"a"},{"nummer":10,"frage":"Die Lehrerin, die die Büro-Werkstatt gegründet hat,","optionen":{"a":"wollte etwas tun, damit Behinderte einen Arbeitsplatz erhalten.","b":"wollte nicht länger Geografie und Geschichte unterrichten.","c":"wird nach der Ausbildung der Behinderten nicht mehr gebraucht."},"loesung":"a"}]},"teil3":{"titel":"Leseverstehen Teil 3","anweisung":"Lesen Sie die Situationen 11-20 und die Anzeigen a-l. Finden Sie für jede Situation die passende Anzeige. Sie können jede Anzeige nur einmal benutzen. Wenn Sie zu einer Situation keine Anzeige finden, markieren Sie ein x.","situationen":[{"nummer":11,"text":"Sie möchten mit Freunden in einem Restaurant essen. Da das Wetter schön ist, möchten Sie gerne draussen sitzen.","loesung":"a"},{"nummer":12,"text":"Sie möchten heute nicht selbst kochen, sondern lieber ein warmes Essen kaufen und mit nach Hause nehmen.","loesung":"a"},{"nummer":13,"text":"In den Sommerferien möchten Sie gerne in die USA fliegen. Sie brauchen dort auch eine Unterkunft.","loesung":"e"},{"nummer":14,"text":"Reisebüros bieten billigere Flüge an, wenn man in letzter Minute bucht. Sie suchen so einen Flug.","loesung":"x"},{"nummer":15,"text":"Ihre Tochter, die studiert, möchte in die USA fliegen. Sie suchen einen billigen Flug für sie.","loesung":"d"},{"nummer":16,"text":"Ihr Sohn ist schlecht in Mathematik und braucht deshalb noch Unterricht ausserhalb der Schule.","loesung":"g"},{"nummer":17,"text":"Das Kind Ihrer Freunde hat Probleme beim Sprechen und braucht deshalb Hilfe.","loesung":"k"},{"nummer":18,"text":"Sie haben einen jungen Franzosen zu Besuch. Sie möchten, dass er in einen Deutschkurs geht.","loesung":"l"},{"nummer":19,"text":"Sie möchten, dass Ihr Sohn in einen Jugendclub geht.","loesung":"x"},{"nummer":20,"text":"Sie interessieren sich für die Probleme ausländischer Jugendlicher in Deutschland.","loesung":"j"}],"anzeigen_hinweis":"Las Anzeigen (a-l) contienen anuncios reales de periódico (restaurantes, agencias de viaje, clases particulares) — se muestran como imagen/escaneo en el examen original."}},"sprachbausteine":{"teil1":{"titel":"Sprachbausteine Teil 1","anweisung":"Lesen Sie den Text und schliessen Sie die Lücken 21-30. Welche Lösung (a, b oder c) ist jeweils richtig?","brief_anrede":"Liebe Karin,","text_mit_luecken":"nach meinem Praktikum in Frankreich bin ich jetzt wieder zu Hause. Wie du ja weisst, wollte ich eigentlich nach Paris, [21] das hat dann leider nicht geklappt. Doch dann habe ich eine Stelle als Praktikant bei [22] Firma in Strassburg gefunden. Dort [23] ich drei Monate geblieben. Die Arbeit war sehr [24] - ich musste schon um 8.00 Uhr im Büro sein -, hat mir aber [25] sehr gut gefallen. Ich habe [26] dieser Zeit in verschiedenen Abteilungen gearbeitet und so nicht nur etwas über die Herstellung von Fernsehgeräten [27], sondern auch über den Verkauf. Und die Kollegen, mit [28] ich am meisten zu tun hatte, waren wirklich sehr nett. Nach dem Praktikum habe ich noch zwei Wochen Urlaub bei [29] Freunden gemacht. Darüber erzähle ich [30] bald mehr - für heute muss ich Schluss machen.","brief_gruss":"Liebe Grüsse\nFritz","aufgaben":[{"nummer":21,"optionen":{"a":"aber","b":"denn","c":"sondern"},"loesung":"a"},{"nummer":22,"optionen":{"a":"eine","b":"einen","c":"einer"},"loesung":"b"},{"nummer":23,"optionen":{"a":"bin","b":"habe","c":"wurde"},"loesung":"a"},{"nummer":24,"optionen":{"a":"anstrengend","b":"anstrengende","c":"anstrengendes"},"loesung":"a"},{"nummer":25,"optionen":{"a":"trotzdem","b":"wegen","c":"weshalb"},"loesung":"a"},{"nummer":26,"optionen":{"a":"bis","b":"in","c":"nach"},"loesung":"b"},{"nummer":27,"optionen":{"a":"gelernt","b":"lernen","c":"lernte"},"loesung":"a"},{"nummer":28,"optionen":{"a":"dem","b":"denen","c":"die"},"loesung":"b"},{"nummer":29,"optionen":{"a":"meine","b":"meinen","c":"meiner"},"loesung":"b"},{"nummer":30,"optionen":{"a":"dir","b":"Ihnen","c":"uns"},"loesung":"a"}]},"teil2":{"titel":"Sprachbausteine Teil 2","anweisung":"Lesen Sie den Text und schliessen Sie die Lücken 31-40. Benutzen Sie die Wörter a-o. Jedes Wort passt nur einmal.","wortliste":{"a":"BESONDERS","b":"DA","c":"DAFÜR","d":"DAMALS","e":"DAMIT","f":"DANKBAR","g":"DESHALB","h":"FÜR","i":"GERNE","j":"KÖNNTEN","k":"MIT","l":"MÜSSTEN","m":"SCHLIESSLICH","n":"WANN","o":"WENN"},"brief_anrede":"Sehr geehrter Herr Janosch,","text_mit_luecken":"[31] ich habe Ihre Anzeige gelesen und interessiere mich sehr [32] Ihr Angebot. Ich möchte mit meiner Familie vom 10.-24. August in Österreich Urlaub machen und hätte deshalb noch [33] nähere Informationen.\n\nMeine Frau und mich interessiert ganz [34] das Freizeitprogramm für Kinder, [35] wir zwei Kinder (3 und 8 Jahre) haben. Gibt es Schwimm- und Tenniskurse für Kinder und [36] ja, was kosten sie? In Ihrer Anzeige steht auch, dass Sie für die Unterkunft günstige Angebote für Kinder haben. Wie viel [37] wir pro Woche für unsere Kinder bezahlen?\n\nUnd [38] noch eine letzte Frage: Wir haben einen kleinen Hund, von dem sich meine Kinder nicht trennen können und den wir auch mitnehmen müssten. Wäre das möglich?\n\nBitte schreiben Sie uns so bald wie möglich, [39] wir uns bald entscheiden können. Ausserdem wären wir Ihnen sehr [40], wenn Sie uns einige Prospekte oder Bilder Ihrer Pension sowie der Umgebung zusenden würden.","brief_gruss":"Mit freundlichen Grüssen\nIhr Anton Müller","aufgaben":[{"nummer":31,"loesung":"b"},{"nummer":32,"loesung":"h"},{"nummer":33,"loesung":"i"},{"nummer":34,"loesung":"a"},{"nummer":35,"loesung":"b"},{"nummer":36,"loesung":"o"},{"nummer":37,"loesung":"l"},{"nummer":38,"loesung":"m"},{"nummer":39,"loesung":"e"},{"nummer":40,"loesung":"f"}]}},"hoeren":{"teil1":{"titel":"Hörverstehen Teil 1","anweisung":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41 bis 45 richtig oder falsch sind.","kontext":"Wir beschäftigen uns heute mit der Frage 'Gleichberechtigung im Haushalt' und konfrontierten über 50 verheiratete Paare mit der Frage: 'Wie teilen Sie sich die Arbeit im Haushalt?'. Hören Sie dazu einige Stellungnahmen.","texte":[{"nummer":41,"sprecher":"Frau","text":"Na, eigentlich mach' alles ich. Ich bin zu Hause, hinterher koche ich, ich wasche ab, ich bügle, ich versorge das Kind. Na ja, mein Mann macht vielleicht den Abwasch und na ja, den Garten, der... für den ist er eher zuständig. Und einkaufen gehen wir beide.","aufgabe":"Die Sprecherin muss im Haushalt fast alles alleine machen.","loesung":"richtig"},{"nummer":42,"sprecher":"Mann","text":"Wo ich im Haushalt helfe? Hm, mein Gott... Kochen. Kochen tue immer ich, das macht mir grossen Spass. Dafür wäscht meine Frau eben ab. Hm... Wäsche waschen mache ich nicht so gerne, das... das macht sie. Dafür gehe ich immer gerne einkaufen. Und Gartenblumen giessen, dass ich ein bisschen aus dem Haus rauskomme.","aufgabe":"Der Sprecher wäscht das Geschirr und die Wäsche.","loesung":"falsch"},{"nummer":43,"sprecher":"Frau","text":"Tja, äh... bei uns ist es so, mein Mann ist voll berufstätig, ich bin zu Hause mit unseren zwei kleinen Kindern, 3 und 5 Jahre alt. Tja, und dann schaut so aus, dass ich koche, abwasche, ja, aufräume... Das muss auch ich machen. Vor allem, die Kinderzimmer schauen natürlich immer schrecklich aus. Wäsche waschen, das mache auch ich, ebenso das Bügeln. Das Einkaufen übernimmt er. Putzen tue ich, und im Sommer betreut er den Garten, giesst die Blumen... Den Gartenarbeit, das ist etwas, das kann ich nicht, das mag ich nicht.","aufgabe":"Die Sprecherin ist berufstätig und hat keine Zeit für die Hausarbeit.","loesung":"falsch"},{"nummer":44,"sprecher":"Mann","text":"Du, wissen Sie, bei uns ist es eigentlich ganz unterschiedlich. Es hängt von der Situation ab. Meistens koche ich und gehe auch einkaufen, während meine Partnerin sich eher mit Aufräumen und Abwaschen beschäftigt. Äh... die Wäsche, die teilen wir uns, und... Garten haben wir keinen, daher entfällt das weg.","aufgabe":"Der Sprecher teilt sich mit seiner Partnerin die Arbeit je nach Situation auf.","loesung":"richtig"},{"nummer":45,"sprecher":"Frau","text":"Also mein Mann, der ist ziemlich faul. Der macht überhaupt nur das, was ihm Spass macht. Einkaufen geht er ja, aber er hält sich nicht an die Liste, die ich ihm aufschreibe, kauft irgendwas, meistens zu teure Sachen. Ab und zu kocht er, aber das Abwaschen überlässt er mir. Na, aufräumen tut er sowieso nicht. Die Wäsche, die schmeisst er einfach ins Eck, das ist meine Sache. Putzen kann keine Rede sein, also, und um den Garten kümmert sich bei uns eigentlich überhaupt keiner, der verwildert.","aufgabe":"Die Sprecherin ist froh, dass ihr Mann so viele Hausarbeiten übernimmt.","loesung":"falsch"}]},"teil2":{"titel":"Hörverstehen Teil 2","anweisung":"Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46 bis 55 richtig oder falsch sind.","einleitung":"Der Turn- und Sportverein Neustadt wird in diesem Jahr 100 Jahre alt und feiert diesen Geburtstag mit einem grossen Programm. Ich begrüsse dazu heute hier im Studio eine Vertreterin des Turn- und Sportvereins Neustadt, Frau Seifert. Guten Tag!","dialog":[{"sprecher":"Frau Seifert","text":"Guten Tag."},{"sprecher":"Locutor","text":"Frau Seifert, welche Aufgaben haben Sie denn im Verein?"},{"sprecher":"Frau Seifert","text":"Ja, also ich führe bei allen Sitzungen Protokoll. Ich schreibe also alles auf, worüber diskutiert wird und was beschlossen wird. Schriftführerin heisst das."},{"sprecher":"Locutor","text":"Aha. Vielleicht liegen Ihnen als Schriftführerin da sogar noch Papiere aus den ersten Vereinsjahren vor?"},{"sprecher":"Frau Seifert","text":"Ja, so ist es. Unsere Kollegen früher waren nämlich äusserst sorgfältig. So konnten wir in unserer Festzeitung zum 100. Geburtstag das Programm von der ersten Hauptversammlung des Vereins veröffentlichen. Das macht sich sehr nett."},{"sprecher":"Locutor","text":"Unglaublich, dass trotz der zwei Kriege in diesem Jahrhundert solche Papiere und Unterlagen noch vorhanden sind. Also, ich nehme mal an, als Ihr Verein vor 100 Jahren gegründet wurde, war Sport doch sicher nur eine Sache für Männer?"},{"sprecher":"Frau Seifert","text":"Ja, klar. Am Anfang war Sport eine reine Männersache. Es hat 16 Jahre gedauert, bis bei uns die ersten Frauen dazukamen. Das war ein echter Fortschritt für die Zeit damals, Anfang des 20. Jahrhunderts."},{"sprecher":"Locutor","text":"Ja, das kann man sich gut vorstellen. Wie viele Frauen haben Sie denn heute im Verein im Vergleich zu Männern?"},{"sprecher":"Frau Seifert","text":"Ja, also heute sind es ziemlich viele. Über 50 % der Mitglieder sind Frauen, das heisst mehr als 1000 der insgesamt 2000 Mitglieder."},{"sprecher":"Locutor","text":"Ihr Verein hat ja hier in Neustadt eine schöne Anlage mit Sportplätzen im Freien und einer grossen Halle. Wer finanziert denn das eigentlich alles?"},{"sprecher":"Frau Seifert","text":"Ja, also 50 % des Geldes, das wir brauchen, bekommen wir durch unsere Mitglieder in Form von Mitgliedsbeiträgen. Den Rest bekommen wir von der Stadt und vom Deutschen Sportbund dazu."},{"sprecher":"Locutor","text":"Wenn man sich Ihr Angebot ansieht, dann staunt man. Da gibt es alles, was zurzeit gefragt ist, von Aerobic über sportliches Gehen bis hin zu Mutter-Kind-Gymnastik."},{"sprecher":"Frau Seifert","text":"Ja, das stimmt. Im Grunde genommen bieten wir fast jede Sportart an, ausser Schwimmen. Es gibt im Nachbarort ein grosses Schwimmbad mit einem extra Schwimmverein, also da wäre es Unsinn, wenn wir eine eigene Abteilung für Schwimmen aufmachen würden."},{"sprecher":"Locutor","text":"Woher kommen denn Ihre Trainer und die Lehrer für alle diese vielen Sportarten?"},{"sprecher":"Frau Seifert","text":"Ja, also die meisten kommen aus dem Verein selber. Wir bilden ja viele Leute aus, die später Sport studieren oder Leistungssport machen. Diese Leute bitten wir oft, im eigenen Verein zu unterrichten."},{"sprecher":"Locutor","text":"Ja, klar. So bleiben ihnen die Talente praktisch erhalten. Frau Seifert, ich bedanke mich für Ihren Besuch hier in unserem Studio und wünsche Ihrem Verein auch für die nächsten 100 Jahre alles Gute."},{"sprecher":"Frau Seifert","text":"Danke."}],"aufgaben":[{"nummer":46,"text":"Der Sportverein plant eine grosse Feier.","loesung":"richtig"},{"nummer":47,"text":"Der Journalist unterhält sich mit einer Vertreterin des Sportvereins.","loesung":"richtig"},{"nummer":48,"text":"Viele Papiere aus den Anfängen des Vereins sind im Krieg verloren gegangen.","loesung":"falsch"},{"nummer":49,"text":"Der Verein veröffentlicht jedes Jahr eine Festzeitung.","loesung":"falsch"},{"nummer":50,"text":"Der Verein hatte von Anfang an auch Frauen als Mitglieder.","loesung":"falsch"},{"nummer":51,"text":"Heute gibt es im Verein mehr Frauen als Männer.","loesung":"richtig"},{"nummer":52,"text":"Im Verein kann man Sport im Freien und in der Halle treiben.","loesung":"richtig"},{"nummer":53,"text":"Die Mitglieder müssen die Kosten für ihren Verein alleine tragen.","loesung":"falsch"},{"nummer":54,"text":"Der Sportverein bietet auch Schwimmkurse an.","loesung":"falsch"},{"nummer":55,"text":"Einige Leute, die im Verein ausgebildet wurden, arbeiten dort heute als Lehrer.","loesung":"richtig"}]},"teil3":{"titel":"Hörverstehen Teil 3","anweisung":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56 bis 60 richtig oder falsch sind.","texte":[{"nummer":56,"kontext":"Sie rufen im Büro einer Sprachschule an und fragen nach dem Weg.","text":"Also, wenn Sie aus dem Bahnhof rauskommen, sind Sie in der Schillerstrasse. Gehen Sie dann nach rechts und immer geradeaus, bis Sie zu einer Kreuzung kommen. Das ist die Königstrasse. Überqueren Sie die Königstrasse, bleiben Sie aber in der Schillerstrasse. Wir sind dann ein Stückchen weiter, gegenüber vom Kino Gloria.","aufgabe":"Das Büro ist in der Schillerstrasse.","loesung":"richtig"},{"nummer":57,"kontext":"Sie möchten ins Kino gehen und rufen die Kinoauskunft an.","text":"Guten Tag, meine Damen und Herren. Wir bringen Ihnen jetzt einen Ausschnitt aus dem Programm der Zürcher Filmtheater. Film Casino: Frühstück bei Tiffany, 18:30 und 20:30. City Kino 1: Sommer, 18:45 und 21:00 Uhr. City Kino 2: Starke Jungs, 18:15 und 19:45. Das Kino Gloria Palast ist zurzeit wegen Renovierung geschlossen.","aufgabe":"Der Film 'Sommer' läuft im Filmcasino.","loesung":"falsch"},{"nummer":58,"kontext":"Sie interessieren sich für das Wetter in Südbayern und hören den Wetterbericht im Radio.","text":"Und nun der Wetterbericht des Wetteramtes München für Montag, den 28. Oktober. Südbayern: Anfangs noch vereinzelt Regen, später zunehmend sonnig mit Höchsttemperaturen bis 18 Grad. Nachts geringer Bodenfrost. Nordbayern: Wechselhaft mit Schauern, dabei mild und sehr windig. Temperaturen nachts bis minus 2 Grad.","aufgabe":"Im Süden Bayerns wird es am Nachmittag schön und nicht sehr warm.","loesung":"falsch"},{"nummer":59,"kontext":"Sie sitzen im Zug und hören folgende Durchsage.","text":"Guten Tag, wir begrüssen alle neu hinzugestiegenen Fahrgäste im ICE Riemenschneider auf der Fahrt von Hamburg nach Nürnberg. Unser Zugrestaurant finden Sie zwischen der ersten und zweiten Wagenklasse, wo Sie das Speisewagenteam ab 11:30 Uhr gern zum Mittagessen erwartet. Verehrte Fahrgäste, auch eine Minibar befindet sich im Zug. Sollten Sie Appetit haben auf einen kleinen Imbiss oder auf kalte und warme Getränke, diese Dinge können Sie im Abteil kaufen. Die Minibar kommt durch die zweite Wagenklasse. Weitere Auskünfte und Informationen erhalten Sie beim ICE-Team dieses Zuges. Wir wünschen Ihnen eine angenehme Reise.","aufgabe":"Im Zugrestaurant können Sie auch Zeitungen kaufen.","loesung":"falsch"},{"nummer":60,"kontext":"Sie sind im Kaufhaus und hören folgende Durchsage.","text":"Das ist spitze! Sommerschlussverkauf! Jetzt bei uns mit Super-Angeboten. Ja, bei uns gibt's zum Beispiel damenhafte Röcke für nur 39 Euro und modische Pullover in lässiger Weite. Wählen Sie aus verschiedenen Farben und Formen, das Stück nur 19 Euro. Und das gibt's ganz aktuell für Sie, meine Herren: Oberhemden in grosser Auswahl, pflegeleicht, für nur 5 Euro. Oder die modischen Cityhosen für Herren, voll waschbar und echt günstig, nur 10 Euro. Greifen Sie zu, solange der Vorrat reicht!","aufgabe":"Damenröcke kosten heute 39 Euro.","loesung":"richtig"}]}},"schriftlich":{"titel":"Schriftlicher Ausdruck","zeit":"30 Minuten (+ 20 Minuten Vorbereitungszeit)","email_absender":"Marianne","email_text":"danke für deine nette Einladung! Ich komme dich sehr gerne besuchen, um dein Land kennenzulernen - wie du weisst, war ich ja noch nie da. Wann wäre die beste Zeit, dich zu besuchen? Ich weiss noch nicht einmal, ob es bei euch im Sommer sehr heiss wird - allzu grosse Hitze mag ich nämlich nicht so sehr. Und gibt es sonst noch irgendwelche Dinge, die ich wissen sollte, bevor ich diese Reise mache? Bitte schreib mir möglichst bald, damit ich mich gut auf die Reise vorbereiten kann.","email_gruss":"Herzliche Grüsse\nMarianne","aufgabe":"Antworten Sie auf die E-Mail. Schreiben Sie etwas zu allen vier Punkten:","punkte":["welche Ausflüge Sie mit Marianne machen wollen","was die beste Jahreszeit für die Reise ist","welche Kleidung sie mitnehmen soll","wie sie sich am besten auf die Reise vorbereiten kann"],"hinweis":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss."},"muendlich":{"titel":"Mündlicher Ausdruck","zeit":"ca. 15 Minuten","teil1":{"titel":"Teil 1 — Einander kennenlernen","anweisung":"Unterhalten Sie sich mit Ihrer Partnerin bzw. Ihrem Partner über folgende Themen:","themen":["Name","Woher sie oder er kommt","Wie sie oder er wohnt (Wohnung, Haus, Garten...)","Familie","Wo sie oder er Deutsch gelernt hat","Was sie oder er macht (Schule, Studium, Beruf...)","Sprachen (welche? wie lange? warum?)"],"zusatzthemen":["wie er oder sie das Wochenende verbringt","welche Hobbys er oder sie hat"],"hinweis":"Die Prüfenden können ausserdem noch weitere Fragen stellen."},"teil2":{"titel":"Teil 2 — Über ein Thema sprechen","anweisung":"Sie haben in einer Zeitschrift etwas zum Thema 'Gruppenreisen' gelesen. Berichten Sie Ihrer Gesprächspartnerin/Ihrem Gesprächspartner darüber. Ihre Gesprächspartnerin/Ihr Gesprächspartner hat eine andere Meinung dazu gelesen und berichtet Ihnen auch darüber. Unterhalten Sie sich dann mit Ihrer Gesprächspartnerin/Ihrem Gesprächspartner über das Thema. Sagen Sie Ihre Meinung und erzählen Sie von eigenen Erfahrungen.","thema":"Gruppenreisen","meinung_a":{"zitat":"Ich verreise gern in einer Gruppe. Allein reisen macht mir keinen Spass. Bei Gruppenreisen kann man neue Leute kennenlernen und hat immer Gesellschaft. Ausserdem ist ein Reiseführer dabei, der einem die Sehenswürdigkeiten zeigt.","person":"Sabine Klostermann, 33 Jahre, Bürokauffrau"},"meinung_b":{"zitat":"Wenn man mit einer Gruppe unterwegs ist, gibt es meist ein festes Programm. Daher reise ich immer allein. Manchmal möchte ich ausschlafen, manchmal etwas besichtigen. Ganz nach Lust und Laune. In einer Gruppe wäre das nicht möglich.","person":"Jens Mühle, 39 Jahre, Physiker"}},"teil3":{"titel":"Teil 3 — Gemeinsam etwas planen","anweisung":"Sie haben zwei Wochen Urlaub gemacht und in dieser Zeit einige nette Deutsche kennengelernt. Vor dem Ende des Urlaubs und bevor Ihre Bekannten alle wieder nach Hause fahren, möchten Sie eine Abschiedsparty feiern. Sie haben die Aufgabe, zusammen mit Ihrem Gesprächspartner/Ihrer Gesprächspartnerin diese Party zu planen. Überlegen Sie sich, was alles zu tun ist und wer welche Aufgaben übernimmt.","liste_titel":"Party","liste_punkte":["Wann?","Wo?","Essen","Getränke","Wer bezahlt wofür?","..."],"schritte":["Entscheiden Sie zuerst, was Sie machen möchten und warum.","Tragen Sie Ihrem Partner Ihre Ideen vor und begründen Sie sie.","Reagieren Sie auf die Ideen Ihres Partners bzw. Ihrer Partnerin und die Begründungen.","Einigen Sie sich auf einen gemeinsamen Programmvorschlag."]}}},"bank":[{"t":"mc","q":"Präteritum de \"tanken\" (ich):","qEn":"Präteritum de \"tanken\" (ich):","o":["tankte","tankst"],"oEn":["tankte","tankst"],"a":0,"x":"Respuesta correcta: <b>tankte</b>.","xen":"Correct answer: <b>tankte</b>. Review the matching rule in the lesson guide.","id":"l1-1","lesson":1},{"t":"mc","q":"Präteritum de \"fahren\" (er):","qEn":"Präteritum de \"fahren\" (er):","o":["fuhr","fahrte"],"oEn":["fuhr","fahrte"],"a":0,"x":"Respuesta correcta: <b>fuhr</b>.","xen":"Correct answer: <b>fuhr</b>. Review the matching rule in the lesson guide.","id":"l1-2","lesson":1},{"t":"mc","q":"Präteritum de \"bringen\" (sie, sing.):","qEn":"Präteritum de \"bringen\" (sie, sing.):","o":["brachte","bringte"],"oEn":["brachte","bringte"],"a":0,"x":"Respuesta correcta: <b>brachte</b>.","xen":"Correct answer: <b>brachte</b>. Review the matching rule in the lesson guide.","id":"l1-3","lesson":1},{"t":"mc","q":"Präteritum de \"landen\" (verb const NAV_IDS=['dashboard','simulation','practice','writing','speaking','errors','strategy'];
let lang=localStorage.getItem('telcB1Lang')||'es';
let state=loadState();let currentPractice=[];let practiceAnswers={};let simPart='lesen1';let simAnswers=state.simAnswers||{};let simMarked=false;let timerHandle=null;let speechTimer=null;let writingTimer=null;let writingSeconds=1800;
function fresh(){return{answered:0,correct:0,sessions:0,errors:{},writing:0,speaking:0,simBest:0,simAnswers:{},drafts:{}}}
function loadState(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem('telcB1State-'+lang)||'{}'))}catch(e){return fresh()}}
function save(){state.simAnswers=simAnswers;localStorage.setItem('telcB1State-'+lang,JSON.stringify(state));renderHero()}
function t(k){return I18N[lang][k]||k}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function readiness(){const acc=state.answered?state.correct/state.answered:0;return Math.min(100,Math.round(acc*45+Math.min(state.answered,120)/120*25+Math.min(state.writing,5)/5*10+Math.min(state.speaking,8)/8*10+state.simBest*.1))}
function renderHero(){const n=readiness();document.getElementById('readiness').textContent=n+'%';document.getElementById('scoreRing').style.setProperty('--score',n)}
function applyI18n(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(x=>x.textContent=t(x.dataset.i));renderNav();renderAll()}
function renderNav(){document.getElementById('nav').innerHTML=NAV_IDS.map((id,i)=>`<button data-go="${id}" class="${document.getElementById(id).classList.contains('active')?'active':''}">${I18N[lang].nav[i]}</button>`).join('')}
function go(id){NAV_IDS.forEach(x=>document.getElementById(x).classList.toggle('active',x===id));renderNav();if(id==='errors')renderErrors();scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});

function renderDashboard(){const acc=state.answered?Math.round(state.correct/state.answered*100):0;const data=[['Lesen','Texte verstehen und Anzeigen zuordnen',state.simBest],['Sprachbausteine','Grammatik, Wortschatz und feste Verbindungen',acc],['Hören','Einmal oder zweimal hören und entscheiden',state.simBest],['Schreiben','E-Mail mit allen Leitpunkten',Math.min(100,state.writing*20)],['Sprechen','Meinung, Erfahrung und gemeinsamer Plan',Math.min(100,state.speaking*12.5)]];document.getElementById('dashboard').innerHTML=`<div class="sectionHead"><div><h2>${t('dashTitle')}</h2><p>${t('dashP')}</p></div></div><div class="grid"><div class="card"><div class="metric">${state.answered}</div><p>${t('qDone')}</p></div><div class="card"><div class="metric">${acc}%</div><p>${t('accuracy')}</p></div><div class="card"><div class="metric">${Object.keys(state.errors).length}</div><p>${t('wrong')}</p></div></div><div class="sectionHead"><div><h2>${t('skills')}</h2></div></div><div class="grid">${data.map(d=>`<div class="card"><h3>${d[0]}</h3><p>${d[1]}</p><div class="bar"><i style="--w:${d[2]}%"></i></div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>${lang==='es'?'Tu siguiente paso':'Your next step'}</h3><p>${Object.keys(state.errors).length?(lang==='es'?'Repite primero tus errores; después haz una ronda nueva.':'Retry your mistakes first, then do a new set.'):(lang==='es'?'Haz 15 preguntas y una tarea productiva hoy.':'Do 15 questions and one productive task today.')}</p><div class="actions"><button class="btn" data-go="practice">${t('practiceNow')}</button><button class="btn secondary" data-go="writing">${I18N[lang].nav[3]}</button></div></div>`}

const O=TELC_DATA.official;
const simParts=[['lesen1','Lesen 1'],['lesen2','Lesen 2'],['lesen3','Lesen 3'],['sprache1','Sprachbausteine 1'],['sprache2','Sprachbausteine 2'],['hoeren1','Hören 1'],['hoeren2','Hören 2'],['hoeren3','Hören 3'],['schriftlich','Schreiben'],['muendlich','Sprechen']];
function simKey(n){return 's-'+n}function choice(n,v){simAnswers[simKey(n)]=v;save();renderSimulation()}
function optionsHtml(n,opts,correct){return `<div class="options">${Object.entries(opts).map(([k,v])=>{const sel=simAnswers[simKey(n)]===k;const cls=simMarked?(k===correct?'ok':sel?'no':''):sel?'selected':'';return`<button class="option ${cls}" onclick="choice('${n}','${k}')"><b>${k.toUpperCase()}.</b> ${esc(v)}</button>`}).join('')}</div>`}
function boolHtml(n,correct){return optionsHtml(n,{richtig:'Richtig',falsch:'Falsch'},correct)}
function examNav(){return`<div class="examNav">${simParts.map(x=>`<button class="${simPart===x[0]?'active':''}" onclick="simPart='${x[0]}';renderSimulation()">${x[1]}</button>`).join('')}</div>`}
function audioBtn(text){const enc=encodeURIComponent(text);return`<button class="btn secondary" onclick="speak(decodeURIComponent('${enc}'))">🔊 ${t('listen')}</button>`}
function renderSimulation(){let b='';if(simPart==='lesen1'){const p=O.leseverstehen.teil1;b=`<div class="reading"><h3>${esc(p.titel)}</h3><p>${esc(p.anweisung)}</p><div class="headings">${Object.entries(p.ueberschriften).map(([k,v])=>`<div><b>${k}</b> ${esc(v)}</div>`).join('')}</div></div>${p.texte.map(x=>`<div class="question"><div class="qnum">Text ${x.nummer}</div><p>${esc(x.text)}</p>${optionsHtml(x.nummer,p.ueberschriften,x.loesung)}</div>`).join('')}`}
 else if(simPart==='lesen2'){const p=O.leseverstehen.teil2;b=`<div class="reading"><h3>${esc(p.text_titel)}</h3><p><b>${esc(p.text_untertitel)}</b></p><p>${esc(p.text)}</p></div>${p.aufgaben.map(x=>`<div class="question"><div class="qnum">${x.nummer}</div><p>${esc(x.frage)}</p>${optionsHtml(x.nummer,x.optionen,x.loesung)}</div>`).join('')}`}
 else if(simPart==='lesen3'){const p=MATCH_READING;const opts={...p.ads,x:'Keine Anzeige passt.'};b=`<div class="reading"><h3>Leseverstehen Teil 3</h3><p>Lesen Sie die Situationen und die Anzeigen. Welche Anzeige passt? Jede Anzeige passt nur einmal. Wählen Sie x, wenn keine Anzeige passt.</p><div class="headings">${Object.entries(opts).map(([k,v])=>`<div><b>${k}</b> ${esc(v)}</div>`).join('')}</div></div>${p.situations.map(x=>`<div class="question"><div class="qnum">${x.nummer}</div><p>${esc(x.text)}</p>${optionsHtml(x.nummer,opts,x.loesung)}</div>`).join('')}`}
 else if(simPart==='sprache1'||simPart==='sprache2'){const p=O.sprachbausteine[simPart==='sprache1'?'teil1':'teil2'];b=`<div class="reading"><h3>${esc(p.titel)}</h3><p>${esc(p.anweisung)}</p>${p.wortliste?`<div class="headings">${Object.entries(p.wortliste).map(([k,v])=>`<div><b>${k}</b> ${esc(v)}</div>`).join('')}</div>`:''}<p><b>${esc(p.brief_anrede)}</b></p><p>${esc(p.text_mit_luecken)}</p><p>${esc(p.brief_gruss)}</p></div>${p.aufgaben.map(x=>`<div class="question"><div class="qnum">${x.nummer}</div>${x.optionen?optionsHtml(x.nummer,x.optionen,x.loesung):optionsHtml(x.nummer,p.wortliste,x.loesung)}</div>`).join('')}`}
 else if(simPart==='hoeren1'){const p=O.hoeren.teil1;b=`<div class="notice">${t('audioTip')}</div>${p.texte.map(x=>`<div class="question"><div class="qnum">${x.nummer}</div><p>${esc(x.aufgabe)}</p>${audioBtn(x.text)}${boolHtml(x.nummer,x.loesung)}${simMarked?`<details><summary>Transkript</summary><p>${esc(x.text)}</p></details>`:''}</div>`).join('')}`}
 else if(simPart==='hoeren2'){const p=O.hoeren.teil2;const audio=p.dialog.map(x=>typeof x==='string'?x:(x.sprecher?x.sprecher+': ':'')+(x.text||'')).join(' ');b=`<div class="card"><h3>${esc(p.einleitung)}</h3>${audioBtn(audio)}${simMarked?`<details><summary>Transkript</summary><p>${esc(audio)}</p></details>`:''}</div>${p.aufgaben.map(x=>`<div class="question"><div class="qnum">${x.nummer}</div><p>${esc(x.text)}</p>${boolHtml(x.nummer,x.loesung)}</div>`).join('')}`}
 else if(simPart==='hoeren3'){const p=O.hoeren.teil3;b=`<div class="notice">${t('audioTip')}</div>${p.texte.map(x=>`<div class="question"><div class="qnum">${x.nummer}</div><p>${esc(x.aufgabe)}</p>${audioBtn(x.text)}${boolHtml(x.nummer,x.loesung)}${simMarked?`<details><summary>Transkript</summary><p>${esc(x.text)}</p></details>`:''}</div>`).join('')}`}
 else if(simPart==='schriftlich'){const p=O.schriftlich;b=`<div class="promptBox"><h3>${esc(p.titel)} · ${esc(p.zeit)}</h3><p><b>${esc(p.email_absender)}</b></p><p>${esc(p.email_text)}</p><p>${esc(p.email_gruss)}</p><p><b>${esc(p.aufgabe)}</b></p><ul>${p.punkte.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><textarea id="simWrite" oninput="simAnswers.simWrite=this.value;save()" placeholder="Betreff: ...">${esc(simAnswers.simWrite||'')}</textarea>`}
 else{const p=O.muendlich;b=`<div class="grid"><div class="card"><h3>${esc(p.teil1.titel)}</h3><p>${esc(p.teil1.anweisung)}</p><div class="chips">${p.teil1.themen.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><div class="card"><h3>${esc(p.teil2.titel)} · ${esc(p.teil2.thema)}</h3><blockquote>“${esc(p.teil2.meinung_a.zitat)}”</blockquote><blockquote>“${esc(p.teil2.meinung_b.zitat)}”</blockquote></div><div class="card"><h3>${esc(p.teil3.titel)}</h3><p>${esc(p.teil3.anweisung)}</p><ul>${p.teil3.liste_punkte.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>`}
 const totalClosed=56,ans=Object.keys(simAnswers).filter(k=>k.startsWith('s-')).length;document.getElementById('simulation').innerHTML=`<div class="sectionHead"><div><h2>${t('simTitle')}</h2><p>${t('simP')}</p></div><div class="timer">${ans}/${totalClosed} ${t('answered')}</div></div>${examNav()}${b}<div class="actions"><button class="btn" onclick="markSimulation()">${t('finish')}</button><button class="btn secondary" onclick="nextSim()">${t('next')}</button></div>`}
function nextSim(){let i=simParts.findIndex(x=>x[0]===simPart);simPart=simParts[Math.min(i+1,simParts.length-1)][0];renderSimulation();scrollTo({top:0,behavior:'smooth'})}
function allOfficialAnswers(){let a={};O.leseverstehen.teil1.texte.forEach(x=>a[x.nummer]=x.loesung);O.leseverstehen.teil2.aufgaben.forEach(x=>a[x.nummer]=x.loesung);MATCH_READING.situations.forEach(x=>a[x.nummer]=x.loesung);['teil1','teil2'].forEach(k=>O.sprachbausteine[k].aufgaben.forEach(x=>a[x.nummer]=x.loesung));O.hoeren.teil1.texte.forEach(x=>a[x.nummer]=x.loesung);O.hoeren.teil2.aufgaben.forEach(x=>a[x.nummer]=x.loesung);O.hoeren.teil3.texte.forEach(x=>a[x.nummer]=x.loesung);return a}
function markSimulation(){simMarked=true;const a=allOfficialAnswers();let ok=0,n=0;for(const[k,v]of Object.entries(a)){n++;if(simAnswers[simKey(k)]===v)ok++}const pct=Math.round(ok/n*100);state.simBest=Math.max(state.simBest,pct);state.sessions++;save();renderSimulation();alert(`${t('result')}: ${ok}/${n} · ${pct}%`)}
function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-CH';u.rate=.92;speechSynthesis.speak(u)}

function practiceQuestion(q,i,marked=false){const opts=lang==='en'&&q.oEn?q.oEn:q.o;const prompt=lang==='en'&&q.qEn?q.qEn:q.q;return`<div class="question ${marked?(practiceAnswers[q.id]===q.a?'correct':'wrong'):''}"><div class="qnum">${i+1} · Lektion ${q.lesson}</div><p>${prompt}</p><div class="options">${opts.map((o,j)=>`<button class="option ${practiceAnswers[q.id]===j?'selected':''} ${marked?(j===q.a?'ok':practiceAnswers[q.id]===j?'no':''):''}" ${marked?'disabled':''} onclick="practiceAnswers['${q.id}']=${j};renderPractice(false)"><b>${String.fromCharCode(65+j)}.</b> ${o}</button>`).join('')}</div>${marked?`<div class="feedback">${lang==='en'?(q.xen||'Correct answer highlighted.'):(q.x||'Respuesta correcta resaltada.')}</div>`:''}</div>`}

let practiceMarked=false;
function makePractice(wrongOnly=false){const errIds=Object.keys(state.errors);let pool=wrongOnly?TELC_DATA.bank.filter(q=>errIds.includes(q.id)):TELC_DATA.bank;currentPractice=shuffle(pool).slice(0,15);practiceAnswers={};practiceMarked=false;renderPractice()}
function makeL11Focus(){currentPractice=TELC_DATA.bank.filter(q=>q.id.startsWith("l11-telc-focus-"));practiceAnswers={};practiceMarked=false;renderPractice()}
function renderPractice(reset=false){if(!currentPractice.length)currentPractice=shuffle(TELC_DATA.bank).slice(0,15);document.getElementById('practice').innerHTML=`<div class="sectionHead"><div><h2>${t('practiceTitle')}</h2><p>${t('practiceP')}</p></div></div><div class="actions"><button class="btn secondary" onclick="makePractice(false)">${t('newSet')}</button><button class="btn secondary" onclick="makeL11Focus()">Lektion 11 · 12 Fragen</button><button class="btn secondary" ${Object.keys(state.errors).length?'':'disabled'} onclick="makePractice(true)">${t('retryWrong')}</button></div>${currentPractice.map((q,i)=>practiceQuestion(q,i,practiceMarked)).join('')}<div class="actions"><button class="btn" onclick="markPractice()">${t('check')}</button></div>`}
function markPractice(){if(practiceMarked)return;practiceMarked=true;let ok=0;currentPractice.forEach(q=>{state.answered++;if(practiceAnswers[q.id]===q.a){ok++;state.correct++;delete state.errors[q.id]}else state.errors[q.id]={id:q.id,lesson:q.lesson,q:q.q,qEn:q.qEn,o:q.o,oEn:q.oEn,a:q.a,x:q.x,xen:q.xen}});state.sessions++;save();renderAll();go('practice');alert(`${t('result')}: ${ok}/${currentPractice.length}`)}

let writingIndex=Number(localStorage.getItem('telcWriteIndex')||0)%WRITING_TOPICS.length;
function renderWriting(){const p=WRITING_TOPICS[writingIndex],draft=state.drafts['w'+writingIndex]||'';document.getElementById('writing').innerHTML=`<div class="sectionHead"><div><h2>${t('writingTitle')}</h2><p>${t('writingP')}</p></div><div class="timer" id="writeClock">${formatWritingTime()}</div></div><div class="actions"><button class="btn secondary" onclick="startWritingTimer()">⏱ 30 min</button><button class="btn secondary" onclick="stopWritingTimer()">${lang==='es'?'Parar':'Stop'}</button></div><div class="grid" style="grid-template-columns:1fr 1.25fr"><div class="promptBox"><h3>${esc(p.de)}</h3><p>${esc(lang==='es'?p.es:p.en)}</p><ol>${p.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${p.focus?`<div class="notice"><b>Foco:</b> ${esc(p.focus)}</div>`:''}<div class="notice"><b>${t('tip')}:</b> ${lang==='es'?'No necesitas frases difíciles. Necesitas un texto claro que responda todos los puntos.':'You do not need difficult sentences. You need a clear text that answers every point.'}</div></div><div><textarea id="writeText" oninput="updateWriting()" placeholder="Betreff: ...\n\nLiebe/r ...">${esc(draft)}</textarea><div class="counter"><span id="wordCount">0</span> ${t('words')}</div></div></div><div class="card"><h3>${t('writingCheck')}</h3><div class="checklist">${['allPoints','greeting','connectors','order','length'].map(k=>`<label><input type="checkbox"> ${t(k)}</label>`).join('')}</div>${p.model?`<details style="margin-top:14px"><summary><b>${lang==='es'?'Ver modelo después de escribir':'View model after writing'}</b></summary><div style="white-space:pre-line;margin-top:12px">${esc(p.model)}</div></details>`:''}</div><div class="actions"><button class="btn" onclick="saveWriting()">${t('saveWriting')}</button><button class="btn secondary" onclick="writingIndex=(writingIndex+1)%WRITING_TOPICS.length;localStorage.setItem('telcWriteIndex',writingIndex);stopWritingTimer();writingSeconds=1800;renderWriting()">${t('newTopic')}</button></div>`;setTimeout(updateWriting,0)}

function formatWritingTime(){const m=Math.floor(writingSeconds/60),s=writingSeconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function stopWritingTimer(){if(writingTimer){clearInterval(writingTimer);writingTimer=null;}}
function startWritingTimer(){stopWritingTimer();writingSeconds=1800;renderWriting();writingTimer=setInterval(()=>{writingSeconds--;const e=document.getElementById('writeClock');if(e)e.textContent=formatWritingTime();if(writingSeconds<=0){stopWritingTimer();if(e)e.textContent='✓';}},1000)}

function updateWriting(){const el=document.getElementById('writeText');if(!el)return;const s=el.value;state.drafts['w'+writingIndex]=s;document.getElementById('wordCount').textContent=(s.trim().match(/\S+/g)||[]).length;save()}
function saveWriting(){updateWriting();state.writing++;state.sessions++;save();renderDashboard();alert(lang==='es'?'Práctica guardada. Revisa ahora la lista de control.':'Practice saved. Now review the checklist.')}

let speakingIndex=Number(localStorage.getItem('telcSpeakIndex')||0)%SPEAKING_TOPICS.length,seconds=0;
function renderSpeaking(){const topic=SPEAKING_TOPICS[speakingIndex];document.getElementById('speaking').innerHTML=`<div class="sectionHead"><div><h2>${t('speakingTitle')}</h2><p>${t('speakingP')}</p></div></div><div class="speechCard"><div class="eyebrow">Thema ${speakingIndex+1}/${SPEAKING_TOPICS.length}</div><h2>${esc(topic)}</h2><blockquote>“Was denken Sie darüber? Welche Erfahrungen haben Sie gemacht?”</blockquote><div class="bigTimer" id="speakClock">${seconds||'—'}</div><p>${t('speakPlan')}</p></div><div class="grid" style="margin-top:14px"><div class="card"><h3>1 · Zusammenfassen</h3><p>In diesem Text / dieser Aussage geht es um …</p></div><div class="card"><h3>2 · Meinung + Grund</h3><p>Meiner Meinung nach …, weil …</p></div><div class="card"><h3>3 · Erfahrung + Frage</h3><p>Bei mir war es so, dass … Was denkst du darüber?</p></div></div><div class="actions"><button class="btn secondary" onclick="startSpeechTimer(20)">${t('prep')}</button><button class="btn" onclick="startSpeechTimer(90)">${t('speak')}</button><button class="btn secondary" onclick="newSpeaking()">${t('newCard')}</button><button class="btn secondary" onclick="state.speaking++;save();renderDashboard();alert('✓')">${t('doneSpeak')}</button></div>`}
function startSpeechTimer(n){clearInterval(speechTimer);seconds=n;renderSpeaking();speechTimer=setInterval(()=>{seconds--;const e=document.getElementById('speakClock');if(e)e.textContent=seconds;if(seconds<=0){clearInterval(speechTimer);if(e)e.textContent='✓'}},1000)}
function newSpeaking(){clearInterval(speechTimer);seconds=0;speakingIndex=(speakingIndex+1)%SPEAKING_TOPICS.length;localStorage.setItem('telcSpeakIndex',speakingIndex);renderSpeaking()}

function renderErrors(){const es=Object.values(state.errors);document.getElementById('errors').innerHTML=`<div class="sectionHead"><div><h2>${t('errorsTitle')}</h2><p>${t('errorsP')}</p></div></div>${es.length?`<div class="actions"><button class="btn" onclick="makePractice(true);go('practice')">${t('retryWrong')}</button></div>${es.map((q,i)=>`<div class="question"><div class="qnum">Lektion ${q.lesson}</div><p>${lang==='en'?(q.qEn||q.q):q.q}</p><p><b>✓ ${(lang==='en'&&q.oEn?q.oEn:q.o)[q.a]}</b></p></div>`).join('')}`:`<div class="card empty">${t('noErrors')}</div>`}`}
function renderStrategy(){const es=lang==='es';document.getElementById('strategy').innerHTML=`<div class="sectionHead"><div><h2>${t('strategyTitle')}</h2><p>${t('strategyP')}</p></div></div><div class="grid"><div class="card"><h3>Lesen</h3><p>${es?'Lee primero la consigna y las preguntas. Subraya nombres, cifras, negaciones y sinónimos; no traduzcas cada palabra.':'Read the task and questions first. Mark names, numbers, negations and synonyms; do not translate every word.'}</p></div><div class="card"><h3>🎧 Crowdsourcing</h3><p>${es?'Escucha primero solo quién, medio, número, ventajas y pago. Después compara las frases.':'First listen only for who, channel, number, advantages and payment.'}</p><div class="actions"><button class="btn secondary" onclick="const u=new SpeechSynthesisUtterance(CROWD_LISTENING_TEXT);u.lang='de-CH';u.rate=.72;speechSynthesis.cancel();speechSynthesis.speak(u)">▶ 0.72×</button><button class="btn secondary" onclick="speak(CROWD_LISTENING_TEXT)">▶ 1×</button></div><details><summary>${es?'Ver las siete señales':'View the seven signals'}</summary><p>Internet · Nussliebhaber · online · zehn · Fans · Vorteile · kein Geld</p></details></div><div class="card"><h3>Sprachbausteine</h3><p>${es?'Mira las palabras antes y después del hueco. Decide primero qué categoría falta: artículo, preposición, conector o forma verbal.':'Look at the words before and after the gap. First decide what is missing: article, preposition, connector or verb form.'}</p></div><div class="card"><h3>Hören</h3><p>${es?'Lee las frases antes del audio. Busca la idea completa: una palabra repetida no garantiza que la respuesta sea correcta.':'Read the statements before the audio. Listen for the full idea: one repeated word does not guarantee the answer.'}</p></div><div class="card"><h3>Schreiben</h3><p>${es?'Reserva dos minutos para planear. Responde todos los puntos, deja párrafos y revisa verbos, mayúsculas y despedida.':'Spend two minutes planning. Answer every point, use paragraphs and check verbs, capital letters and the closing.'}</p></div><div class="card"><h3>${es?'Palabras desconocidas':'Unknown words'}</h3><p>${es?'No traduzcas todo. Divide palabras compuestas, busca la raíz y continúa si la palabra no cambia la respuesta. En Hören recupera el hilo con aber, deshalb y trotzdem.':'Do not translate everything. Split compounds, find the root and continue when the word does not change the answer.'}</p></div><div class="card"><h3>Sprechen</h3><p>${es?'No memorices discursos largos. Usa cuatro pasos: resumen, opinión con razón, experiencia y pregunta al compañero.':'Do not memorise long speeches. Use four steps: summary, opinion with a reason, experience and a question to your partner.'}</p></div><div class="card"><h3>${es?'Rutina de 7 días':'7-day routine'}</h3><p>${es?'Cada día: 15 preguntas + una destreza productiva. Días 3 y 6: simulacro. Día 7: solo errores y fórmulas útiles.':'Each day: 15 questions + one productive skill. Days 3 and 6: mock exam. Day 7: mistakes and useful phrases only.'}</p></div></div>`}
function renderAll(){renderHero();renderDashboard();renderSimulation();renderPractice();renderWriting();renderSpeaking();renderErrors();renderStrategy()}
