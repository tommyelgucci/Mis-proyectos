<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8ef">
<meta name="description" content="ALOdeutsch Lernreise: aprende alemán con misiones progresivas de A1 a C2.">
<title>ALOdeutsch · Lernreise A1–C2</title>
<style>
:root{--ink:#202b36;--muted:#687681;--paper:#f7f8ef;--card:#fff;--border:#e3e8dd;--ink-soft:#687681}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:12px 10px 28px}
#scr-dashboard{display:none!important}
.scr{display:block!important;visibility:visible!important}
button{font:inherit;touch-action:manipulation}
@media(max-width:480px){body{padding:8px 6px 22px}}
</style>
</head>
<body>
<p id="lr-loading" role="status" style="max-width:650px;margin:22px auto;padding:14px;text-align:center;background:#fff;border:1px solid #e3e8dd;border-radius:14px">El búho está preparando tu aventura de alemán…</p>
<div id="scr-dashboard" aria-hidden="true"></div>
<script src="./lernreise.js"></script>
<script>
(function(){
 function launch(){
  var loading=document.getElementById('lr-loading');
  if(window.Lernreise&&typeof window.Lernreise.map==='function'){
   if(loading)loading.remove();
   window.Lernreise.map();
  }else if(loading){loading.textContent='No se ha podido cargar la ruta. Comprueba que lernreise.js está publicado junto a este archivo.';loading.style.color='#842d2d'}
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',launch,{once:true});else launch();
})();
</script>
</body>
</html>
